name: Process Battle BGM v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/process-bgm-v1.yml'

permissions:
  contents: write

jobs:
  process-bgm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ffmpeg
        run: |
          ffmpeg -version | head -n 1

      - name: Build 50-percent-tempo background masters
        shell: bash
        run: |
          set -euo pipefail
          if ffmpeg -hide_banner -filters 2>/dev/null | grep -q ' rubberband '; then
            TEMPO='rubberband=tempo=0.5:pitch=1.0'
            echo "Using rubberband pitch-preserving time stretch"
          else
            TEMPO='atempo=0.5'
            echo "Rubberband unavailable; using ffmpeg atempo"
          fi

          # Compress the arrangement peaks first, then loudness-normalise the
          # finished slower master. The -24 LUFS / LRA 4 target keeps later
          # drums/bass from suddenly feeling much louder than the intro.
          FILTER="${TEMPO},acompressor=threshold=0.125:ratio=4:attack=20:release=250,loudnorm=I=-24:TP=-3:LRA=4"

          ffmpeg -y -hide_banner -i assets/audio/bgmusic.mp3 \
            -af "${FILTER}" -ar 44100 -c:a libmp3lame -b:a 128k \
            assets/audio/bgmusic-slow-v1.mp3

          ffmpeg -y -hide_banner -i assets/audio/bgmusic2.mp3 \
            -af "${FILTER}" -ar 44100 -c:a libmp3lame -b:a 128k \
            assets/audio/bgmusic2-slow-v1.mp3

          ls -lh assets/audio/bgmusic*-slow-v1.mp3

      - name: Commit processed masters
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/bgmusic-slow-v1.mp3 assets/audio/bgmusic2-slow-v1.mp3
          git commit -m "audio: add offline 50-percent-tempo battle masters"
          git push origin HEAD:main
