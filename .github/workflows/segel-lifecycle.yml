name: Segel hero and result lifecycle
on:
  push:
    branches: [main]
    paths: ['js/segel-demo-v2.1.0.js', 'js/engine/production-journey.js', 'js/rapid-lock-v1.js', 'css/rapid-lock-v1.css', 'audit/restu-cinematic.test.js', 'audit/wira-restu-reaction.test.js', 'js/progression.js', 'audit/gembok-xp.test.js', 'audit/segel-*.test.js', '.github/workflows/segel-lifecycle.yml']
  pull_request:
    paths: ['js/segel-demo-v2.1.0.js', 'js/engine/production-journey.js', 'js/rapid-lock-v1.js', 'css/rapid-lock-v1.css', 'audit/restu-cinematic.test.js', 'audit/wira-restu-reaction.test.js', 'js/progression.js', 'audit/gembok-xp.test.js', 'audit/segel-*.test.js', '.github/workflows/segel-lifecycle.yml']
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test audit/segel-hero-visibility.test.js audit/segel-result-lifecycle.test.js audit/gembok-xp.test.js audit/rapid-lock.test.js audit/restu-cinematic.test.js audit/wira-restu-reaction.test.js
