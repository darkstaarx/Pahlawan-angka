name: Verify Rescue Target Fix
# rerun after gate-fixture correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-rescue-target.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test js/pet-collection-system.test.js
