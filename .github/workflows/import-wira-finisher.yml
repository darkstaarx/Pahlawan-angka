name: Import Wira Finisher Asset

on:
  push:
    branches:
      - asset-wira-finisher-import-20261002
    paths:
      - .github/workflows/import-wira-finisher.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify Wira finisher
        env:
          VIDEO_URL: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3MaX5TB1aHVAPINCF19CYRIcd/7c9c281b-6db0-4666-83bc-f5d7ee457b42.mp4'
          VIDEO_SHA256: '970356b9b5d1a34f064752092047b478f7a34ffcd116c7fa3cfd68ec5b6dd0f7'
        run: |
          set -euo pipefail
          mkdir -p assets/heroes/wira-chibi/finisher
          curl -fL "$VIDEO_URL" -o assets/heroes/wira-chibi/finisher/wira-finisher-v1.mp4
          echo "$VIDEO_SHA256  assets/heroes/wira-chibi/finisher/wira-finisher-v1.mp4" | sha256sum -c -

      - name: Commit asset to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heroes/wira-chibi/finisher/wira-finisher-v1.mp4
          if git diff --cached --quiet; then
            echo "Asset already present; nothing to commit."
            exit 0
          fi
          git commit -m "feat: add Wira finisher video asset"
          git push origin HEAD:main
