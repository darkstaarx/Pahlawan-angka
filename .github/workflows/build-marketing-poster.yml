name: Build marketing poster

on:
  push:
    branches: [main]
    paths:
      - "marketing/build_poster.py"
      - ".github/workflows/build-marketing-poster.yml"
      - "assets/branding/pahlawan-angka-full-logo-v1.png"
      - "assets/branding/login-chibi-math-world-v1.webp"
      - "assets/heroes/wira-chibi/attack.webp"
      - "assets/heroes/bunga/profile-happy-v1.webp"
      - "assets/heroes/sidma/idle.webp"
      - "assets/pets/aurora/front.webp"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - run: python marketing/build_poster.py
      - name: Commit rendered poster
        run: |
          if git diff --quiet -- marketing/pahlawan-angka-poster-final.jpg; then
            echo "Poster unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/pahlawan-angka-poster-final.jpg
          git commit -m "chore: render official Pahlawan Angka poster"
          git push
