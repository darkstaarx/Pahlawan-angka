name: Wear OS watch face (Malaysia Pixel Lite)

on:
  push:
    paths:
      - "wearos/malaysia-pixel-lite/**"
      - "!wearos/malaysia-pixel-lite/docs/emulator-run/**"
      - ".github/workflows/wearos-watchface.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wearos-watchface-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: wearos/malaysia-pixel-lite

jobs:
  build:
    name: Validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static checks (resources, layering, round-screen fit, AOD, memory)
        run: |
          python -m pip install --quiet pillow
          python tools/check_watchface.py
      - name: Official WFF validator (formats 1-5)
        run: bash tools/validate_wff.sh 1 2 3 4 5
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :watchface:assembleDebug
      - name: Inspect APK
        run: |
          APK=watchface/build/outputs/apk/debug/watchface-debug.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump badging "$APK" | head -20
          unzip -l "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: malaysia-pixel-lite-debug-apk
          path: wearos/malaysia-pixel-lite/watchface/build/outputs/apk/debug/watchface-debug.apk

  emulator:
    name: Emulator test (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: large-round-api34
            device: wearos_large_round
            api: 34
          - name: small-round-api33
            device: wearos_small_round
            api: 33
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: malaysia-pixel-lite-debug-apk
          path: wearos/malaysia-pixel-lite/watchface/build/outputs/apk/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot Wear OS emulator and run the test script
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-wear
          arch: x86_64
          profile: ${{ matrix.device }}
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          working-directory: wearos/malaysia-pixel-lite
          script: bash scripts/ci-emulator-run.sh
      - name: Collect results
        if: always()
        run: |
          RUN=$(ls -d test-output/* 2>/dev/null | tail -1)
          mkdir -p "docs/emulator-run/${{ matrix.name }}"
          if [ -n "$RUN" ]; then cp -r "$RUN"/. "docs/emulator-run/${{ matrix.name }}/"; fi
          python3 -m pip install --quiet pillow && python3 tools/emulator_contact_sheet.py "docs/emulator-run/${{ matrix.name }}" || true
          ls -la "docs/emulator-run/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-run-${{ matrix.name }}
          path: wearos/malaysia-pixel-lite/docs/emulator-run/${{ matrix.name }}
      - name: Commit screenshots to this branch (not main)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/emulator-run/${{ matrix.name }}"
          git diff --cached --quiet && exit 0
          git commit -m "test: Wear OS emulator run ${{ matrix.name }} [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
