name: Import PAMusic Battle BGM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-pamusic-bgm.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PAMusic
        run: |
          set -euo pipefail
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3J3MaX5TB1aHVAPINCF19CYRIcd/a955f723-0c90-4a46-88b6-f5f7fc16847e.mp3" -o assets/audio/PAMusic.mp3
          test -s assets/audio/PAMusic.mp3
          ls -lh assets/audio/PAMusic.mp3

      - name: Replace old battle BGM assets
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            assets/audio/bgmusic.mp3 \
            assets/audio/bgmusic2.mp3 \
            assets/audio/bgmusic-slow-v1.mp3 \
            assets/audio/bgmusic2-slow-v1.mp3
          git add assets/audio/PAMusic.mp3

      - name: Commit imported battle music
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audio: replace battle BGM with PAMusic"
          git push origin HEAD:main
