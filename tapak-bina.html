<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14335c">
<title>Arkitek Dimensi · Ruang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800;900&display=swap">
<link rel="stylesheet" href="css/minigame-worked-v1.css?v=1.13.0">
<style>
/* Satu skrin: HUD › pemandangan menara › banner soalan › panel alat › butang.
   Palet ikut Pahlawan Angka: biru malam, emas, kad krim, teks biru gelap. */
:root{
  --bg:#08101d; --navy:#131d30; --navy2:#14335c; --line:#2b3958;
  --gold:#ffd24b; --gold2:#ffd036; --gold-lt:#ffe5a6; --gold-dk:#b78b47; --brown:#3b2b07;
  --cream:#fffcf0; --cream2:#f6ecd2; --cream3:#e7d9b7;
  --ink:#123158; --ink2:#38567c; --blue:#59c8ff; --blue2:#2f8fd0;
  --good:#55d98a; --good-dk:#24894f; --bad:#ff6875; --bad-dk:#a3283a;
  --sh-a:#78a9ff; --sh-b:#ffd24b; --sh-c:#55d98a; --sh-d:#ff8fb1; --sh-e:#b9a3ff;
  --f-display:"Baloo 2","Trebuchet MS",Verdana,sans-serif;
  --f-body:"Nunito","Trebuchet MS",Verdana,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* "Jom tengok cara" tiles: this page has no .tl buttons of its own. */
.wk-wrap .tiles.wk .tl{border:3px solid var(--gold-dk);border-radius:14px;background:var(--cream);color:var(--ink);font:800 22px/1.1 var(--f-display);box-shadow:0 3px 0 var(--gold-dk);padding:8px 6px}
.wk-wrap .tiles.wk .tl:disabled{opacity:.45}.wk-wrap .tiles.wk .tl.wk-yes{background:#eaffde;border-color:var(--good-dk)}
.panel.wk-pad .pad{display:none}.panel.wk-pad .padfig>svg,.panel.wk-pad .picks svg{max-height:min(20dvh,170px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0,#14335c,var(--bg) 70%);font-family:var(--f-body);color:var(--ink);overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.game{position:relative;width:100%;max-width:470px;height:100%;max-height:940px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a2a46,#131d30 40%,#0f1828);overflow:hidden;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 0 40px #000a}
.game>*{flex:none}

/* HUD */
.hud{position:relative;z-index:6;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:7px 10px;background:linear-gradient(180deg,#1d3a63,#14335c);border-bottom:3px solid var(--gold-dk);box-shadow:0 3px 0 #0006}
.chip{display:flex;align-items:center;gap:6px;background:var(--cream);border:2px solid var(--gold-dk);border-radius:14px;padding:3px 9px 3px 4px;box-shadow:inset 0 -3px 0 var(--cream3)}
.chip b{font:800 13px/1 var(--f-display);color:var(--ink);white-space:nowrap}
.ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0%),#2b3958 0);display:grid;place-items:center;border:2px solid var(--gold-dk);transition:background .5s}
.ring::after{content:"▲";font-size:10px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:var(--navy)}
.ring.lit{box-shadow:0 0 12px #ffd24baa}
.title{text-align:center;min-width:0}
.title small{display:block;font:900 8px/1 var(--f-body);letter-spacing:1.3px;color:#9cc8f0;white-space:nowrap}
.title b{display:block;font:800 clamp(16px,4.6vw,20px)/1.05 var(--f-display);color:var(--gold);text-shadow:0 2px 0 #0a1a33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-r{display:flex;gap:6px;align-items:center}
.stars{display:flex;align-items:center;gap:4px;background:var(--cream);border:2px solid var(--gold-dk);border-radius:14px;padding:4px 9px 4px 6px;font:800 13px/1 var(--f-display);color:var(--ink);box-shadow:inset 0 -3px 0 var(--cream3);font-variant-numeric:tabular-nums}
.stars i{font-style:normal;color:var(--gold2);text-shadow:0 1px 0 var(--gold-dk)}
.stars.bump{animation:bump .5s}
.icon{width:36px;height:36px;border-radius:12px;border:2px solid var(--gold-dk);background:var(--cream);font-size:16px;box-shadow:inset 0 -3px 0 var(--cream3)}

/* Pemandangan */
.scene{position:relative;flex:1 1 auto!important;min-height:132px;container-type:size;overflow:hidden;background:linear-gradient(180deg,#1d3a63 0%,#5b6fa8 45%,#f2a77a 82%,#ffd9a0 100%)}
.skyline{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.crane{position:absolute;z-index:1;left:calc(50% + 34cqh);bottom:0;height:92cqh;aspect-ratio:.6;transform:translateX(-90%)}
.crane svg{width:100%;height:100%}
.crane .hook{transform-origin:16px 41px;animation:sway 3s ease-in-out infinite}
.crane .hook.drop{animation:drop 1s ease-in-out,sway 3s ease-in-out 1s infinite}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes drop{50%{transform:translateY(46px)}}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,#08101d66);pointer-events:none}
.tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;transition:background 1s}
.candi{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);height:min(96cqh,230px);aspect-ratio:200/220;z-index:2;filter:drop-shadow(0 6px 4px #0006)}
.candi svg{width:100%;height:100%;overflow:visible}
.candi .part{opacity:0;transform:translateY(-30px);transition:opacity .3s,transform .55s cubic-bezier(.3,1.6,.5,1)}
.candi .part.on{opacity:1;transform:none}
.candi .ghost{opacity:.18}
.candi.done{animation:glowC 1.4s ease-in-out 2}
@keyframes glowC{50%{filter:drop-shadow(0 0 16px #ffd24b) drop-shadow(0 6px 4px #0006)}}
.wira{position:absolute;z-index:4;left:4px;bottom:4px;width:clamp(74px,42cqh,110px);animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
.wira img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 3px #0007)}
.wira.cheer{animation:hop .55s ease 2}
.pet{position:absolute;z-index:3;right:-4px;bottom:2px;width:clamp(96px,56cqh,150px);transition:transform .8s cubic-bezier(.3,1.2,.5,1),opacity .4s}
.pet img{display:block;width:100%;height:auto;filter:drop-shadow(0 5px 4px #0006);animation:bob 1.9s ease-in-out infinite}
.pet.away{transform:translateX(120%);opacity:0;transition:none}
.pet.leave{transform:translateX(130%);opacity:0;transition:transform .7s ease-in,opacity .7s}
.pet.shake img{animation:shake .45s}
.plan{position:absolute;left:-6px;bottom:18%;width:38%;transform:rotate(-12deg);filter:drop-shadow(0 2px 2px #0006)}
.bubble{position:absolute;z-index:7;right:8px;top:8px;max-width:56%;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:6px 10px 7px;box-shadow:0 4px 0 #0005;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .25s;transform-origin:80% 100%}
.bubble.hide{transform:scale(.4);opacity:0}
.bubble.dim{opacity:.12}
.bubble::after{content:"";position:absolute;right:40px;bottom:-12px;width:14px;height:14px;background:var(--cream);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble .who{font:900 9px/1 var(--f-body);letter-spacing:1px;color:var(--blue2);text-transform:uppercase}
.bubble .say{font:800 12.5px/1.25 var(--f-body);margin-top:3px;color:var(--ink);text-wrap:balance}
.wsay{position:absolute;z-index:8;left:8px;top:8px;max-width:62%;background:#edf9ff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font:800 12px/1.32 var(--f-body);color:var(--ink);box-shadow:0 4px 0 #0005;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .2s;transform-origin:20% 100%}
.wsay.hide{transform:scale(.4);opacity:0;pointer-events:none}
.wsay b{display:block;font:900 9px/1 var(--f-body);letter-spacing:1px;color:var(--blue2);margin-bottom:3px}
.wsay.bad{background:#ffe3e6}.wsay.bad b{color:var(--bad-dk)}
.wsay::after{content:"";position:absolute;left:30px;bottom:-11px;width:12px;height:12px;background:inherit;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.stamp{position:absolute;z-index:9;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-10deg) scale(2.4);opacity:0;pointer-events:none;text-align:center;font:800 42px/.9 var(--f-display);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.stamp small{display:block;font:900 13px/1.2 var(--f-body);-webkit-text-stroke:0;text-shadow:none;color:var(--brown);background:var(--gold);border:3px solid var(--ink);border-radius:20px;padding:3px 12px;margin:8px auto 0;width:max-content}
.stamp.show{animation:stampIn .55s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp.hebat{color:var(--gold)}.stamp.bagus{color:var(--good)}.stamp.ok{color:var(--blue)}
.burst{position:absolute;inset:0;z-index:8;pointer-events:none}
.burst i{position:absolute;left:50%;top:48%;width:9px;height:9px;border-radius:2px;animation:burst 1s ease-out forwards}
.devbtn{position:absolute;z-index:6;left:8px;bottom:auto;top:8px;font:900 10px/1 var(--f-body);color:#fff;background:#ffffff26;border:2px dashed #fff9;border-radius:9px;padding:4px 7px}

/* Banner soalan */
.banner{position:relative;margin:8px 10px 0;display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;padding:7px 11px 8px 7px;background:linear-gradient(180deg,#1d4878,#14335c);color:#fff;border-radius:14px;border:2px solid var(--gold-dk);box-shadow:0 4px 0 #0007,inset 0 1px 0 #ffffff22}
.banner>div{min-width:0}
.banner .tag{position:absolute;right:10px;top:-11px;background:var(--gold);color:var(--brown);border:2px solid var(--brown);border-radius:20px;padding:2px 8px;font:900 9.5px/1.2 var(--f-body);letter-spacing:.8px}
.disc{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--cream);border:2px solid var(--gold-dk);border-radius:10px;padding:3px 7px 4px}
.disc b{font:900 9px/1 var(--f-body);letter-spacing:.8px;color:var(--ink2)}
.disc .dots{display:flex;gap:3px}.disc .dots i{width:7px;height:7px;border-radius:50%;background:var(--cream3);border:1.5px solid var(--ink2)}
.disc .dots i.done{background:var(--gold2)}.disc .dots i.now{background:var(--blue)}
.banner .q{display:block;font:800 14.5px/1.22 var(--f-display);text-wrap:pretty}
.banner .sub{display:block;font:700 11px/1.3 var(--f-body);color:#cfe3ff;margin-top:2px}

/* Panel alat */
.panel{margin:8px 10px 0;padding:8px 10px 10px;background:var(--cream);border:2px solid var(--gold-dk);border-radius:16px;box-shadow:inset 0 -5px 0 var(--cream3),0 4px 0 #0006;display:flex;flex-direction:column;align-items:center;gap:6px}
.fig{display:block;max-width:100%;height:auto}
.fig text{font-family:var(--f-display);font-weight:800}
.readout{font:900 10px/1 var(--f-body);color:var(--ink2);letter-spacing:.5px;display:flex;gap:8px;align-items:baseline}
.readout b{font:800 20px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}

/* pilih */
.picks{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:7px;width:100%}
.pick{position:relative;border:2px solid var(--cream3);background:#fff;border-radius:12px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--cream3);min-height:64px;justify-content:center}
.pick svg{width:100%;max-width:74px;height:auto}
.pick span{font:900 10.5px/1.15 var(--f-body);color:var(--ink);text-align:center}
.pick.txt{min-height:44px}.pick.txt span{font:800 15px/1.1 var(--f-display)}
.pick.on{border-color:var(--ink);background:#edf9ff;box-shadow:0 3px 0 var(--ink)}
.pick.on::after{content:"✓";position:absolute;right:4px;top:3px;width:17px;height:17px;border-radius:50%;background:var(--ink);color:#fff;font:900 11px/17px var(--f-body);text-align:center}
.pick.right{border-color:var(--good-dk);background:#e6f7ec}
/* pad */
.padrow{display:flex;gap:8px;width:100%;align-items:stretch}
.padfig{flex:1;min-width:0;display:grid;place-items:center}
.pad{width:46%;display:flex;flex-direction:column;gap:4px}
.disp{display:flex;justify-content:space-between;align-items:baseline;background:#fff;border:2px dashed var(--cream3);border-radius:9px;padding:4px 8px}
.disp b{font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}.disp span{font:900 10px/1 var(--f-body);color:var(--ink2)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.keys button{height:clamp(28px,4.6dvh,36px);border-radius:9px;border:2px solid var(--ink);background:#fff;font:800 16px/1 var(--f-display);color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.keys button:active{transform:translateY(2px);box-shadow:none}
/* grid, lines, seq, sudut, jangka */
.board{touch-action:none;user-select:none;cursor:pointer}
.seqrow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.slot{width:36px;height:36px;border-radius:9px;border:2px solid var(--cream3);background:#fff;display:grid;place-items:center}
.slot svg{width:28px;height:28px}
.slot.blank{border:2px dashed var(--ink2);background:#edf9ff}.slot.blank.next{border-color:var(--blue2);box-shadow:0 0 0 3px #59c8ff55}
.palette{display:flex;gap:6px;justify-content:center}
.palette button{width:52px;height:48px;border-radius:11px;border:2px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
.palette button svg{width:36px;height:36px}
.palette button:active{transform:translateY(2px);box-shadow:none}
.ctrls{display:flex;gap:6px;margin:8px 10px 0}
.ctrls button{flex:1;min-height:40px;border-radius:12px;border:2px solid var(--ink);background:#fff;font:800 15px/1 var(--f-display);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.ctrls button.plus{background:#e6f7ec}
.ctrls button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.aux{display:flex;justify-content:space-between;width:100%}
.aux button{background:none;border:0;font:900 11px/1 var(--f-body);color:var(--ink2);text-decoration:underline;padding:3px 2px}

/* butang */
.actions{display:flex;gap:8px;margin:9px 10px 0}
.btn{min-height:48px;border-radius:14px;font:800 16px/1 var(--f-display);box-shadow:0 5px 0 #0008;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0008}
.btn.hint{width:34%;background:#edf9ff;color:var(--ink);border:2px solid var(--blue2)}
.btn.go{flex:1;background:linear-gradient(180deg,var(--gold-lt),var(--gold2));color:var(--brown);border:2px solid var(--gold-dk)}
.btn.go.next{background:linear-gradient(180deg,#9df0c0,var(--good));color:#0d3a22;border-color:var(--good-dk)}

/* kad akhir & dev */
.overlay{position:absolute;inset:0;z-index:30;background:#08101ddd;display:flex;align-items:center;justify-content:center;padding:20px 14px}
.card{width:100%;background:linear-gradient(180deg,#1d4878,#14335c);border:3px solid var(--gold);border-radius:20px;padding:18px 16px 16px;text-align:center;color:#fff;box-shadow:0 0 0 5px #ffd24b33,0 14px 40px #000a;animation:rise .5s cubic-bezier(.3,1.4,.5,1)}
.card h2{margin:0 0 6px;font:800 25px/1 var(--f-display);color:var(--gold)}
.card p{margin:0 0 10px;font:700 12.5px/1.45 var(--f-body);color:#d6e6ff}
.faces{display:flex;justify-content:center;gap:4px;margin-bottom:14px}.faces div{display:flex;flex-direction:column;align-items:center;font:900 11px/1.2 var(--f-body);color:var(--gold)}.faces img{width:48px;height:48px;object-fit:contain}
.card .btn{width:100%}
@keyframes breathe{50%{transform:scaleY(1.025) translateY(-1px)}}
@keyframes hop{40%{transform:translateY(-16px)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes bump{40%{transform:scale(1.18)}}
@keyframes stampIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(-10deg) scale(2.4)}60%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(.92)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@media (max-width:380px){.pad{width:50%}.pick span{font-size:9.5px}}
@media (max-height:700px){.banner .q{font-size:13.5px}.keys button{height:30px}.pick{min-height:56px}.pick svg{max-width:60px}.btn{min-height:44px}}
@media (max-height:640px){.banner .sub{display:none}.slot{width:34px;height:34px}.palette button{height:42px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<style>/* Question first: waist-up Wira and props for this scene (css/minigame-question-first-v1.css). */
.game .scene{--belt:.62}
.game .panel .picks[style="--n:4"]:only-child{grid-template-columns:repeat(2,minmax(0,1fr))}.game .panel .picks:only-child .pick svg{max-width:110px}</style></head>
<body>
<main class="game" aria-label="Arkitek Dimensi">
  <header class="hud">
    <div class="chip"><span class="ring" id="ring"></span><b id="setLbl">Menara 1</b></div>
    <div class="title"><small>KEMAHIRAN FOKUS · RUANG</small><b>Arkitek Dimensi</b></div>
    <div class="hud-r"><span class="stars" id="starsBox" aria-label="Bintang"><i>★</i><span id="stars">0</span></span><button class="icon" id="sound" aria-label="Hidupkan bunyi">🔈</button></div>
  </header>

  <section class="scene" aria-label="Tapak bina menara berkembar di Kuala Lumpur">
    <div class="tint" id="tint"></div>
    <svg class="skyline" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <circle cx="330" cy="46" r="20" fill="#ffd9a0" opacity=".85"/>
      <path d="M0 150 Q60 118 120 140 T250 132 T400 128 L400 200 L0 200Z" fill="#3c5a86" opacity=".55"/>
      <g fill="#24406a">
        <rect x="6" y="138" width="22" height="62"/><rect x="32" y="122" width="16" height="78"/><rect x="52" y="146" width="26" height="54"/><rect x="82" y="130" width="14" height="70"/>
        <rect x="292" y="134" width="20" height="66"/><rect x="316" y="116" width="14" height="84"/><rect x="334" y="140" width="28" height="60"/><rect x="366" y="124" width="18" height="76"/><rect x="386" y="146" width="14" height="54"/>
        <polygon points="112,200 112,108 118,96 124,108 124,200"/><rect x="108" y="150" width="20" height="50"/>
      </g>
      <g fill="#ffd24b" opacity=".7"><rect x="10" y="146" width="3" height="3"/><rect x="18" y="160" width="3" height="3"/><rect x="36" y="132" width="3" height="3"/><rect x="58" y="156" width="3" height="3"/><rect x="298" y="144" width="3" height="3"/><rect x="320" y="128" width="3" height="3"/><rect x="342" y="150" width="3" height="3"/><rect x="372" y="134" width="3" height="3"/></g>
    </svg>
    <div class="crane" aria-hidden="true"><svg viewBox="0 0 120 200"><g stroke="#123158" stroke-width="2.5" fill="#ffd24b"><rect x="92" y="40" width="10" height="160"/><path d="M92 40 L102 40 L97 30Z"/><rect x="0" y="34" width="110" height="7"/><rect x="100" y="28" width="16" height="16" fill="#ff8fb1"/></g><g stroke="#123158" stroke-width="1.4" fill="none"><path d="M92 50 L102 62 M102 50 L92 62 M92 74 L102 86 M102 74 L92 86 M92 98 L102 110 M102 98 L92 110 M92 122 L102 134 M102 122 L92 134"/></g><g class="hook"><line x1="16" y1="41" x2="16" y2="70" stroke="#123158" stroke-width="2"/><path d="M11 70 L21 70 L21 76 Q16 84 11 76" fill="#8fa6c4" stroke="#123158" stroke-width="2"/></g></svg></div>
    <div class="candi" id="candi" aria-label="Menara berkembar yang sedang dibina"></div>

(()=>{

/* ---------- bentuk 2D ---------- */

 'bulatan':c=>'<circle cx="50" cy="50" r="38" fill="'+c+'" '+SW+'/>',

const S3={

 'prisma segi tiga':c=>sh([[10,82],[30,46],[50,82]],c)+sh([[30,46],[62,26],[82,62],[50,82]],'#00000026'),

 'piramid segi tiga':c=>sh([[50,14],[16,76],[62,86]],c)+sh([[50,14],[62,86],[86,66]],'#00000026')+'<path d="M16 76 L86 66" fill="none" stroke="'+INK+'" stroke-width="2" stroke-dasharray="4 4"/>',
 'silinder':c=>'<path d="M20 26 L20 74 A30 9 0 0 0 80 74 L80 26" fill="'+c+'" '+SW+'/><ellipse cx="50" cy="26" rx="30" ry="9" fill="#ffffffaa" '+SW+'/>',
 'kon':c=>'<path d="M50 12 L18 76 A32 9 0 0 0 82 76 Z" fill="'+c+'" '+SW+'/><path d="M18 76 A32 9 0 0 1 82 76" fill="none" stroke="'+INK+'" stroke-width="2" stroke-dasharray="4 4"/>',
 'sfera':c=>'<circle cx="50" cy="50" r="36" fill="'+c+'" '+SW+'/><path d="M14 50 A36 10 0 0 0 86 50" fill="none" stroke="'+INK+'" stroke-width="2"/><path d="M14 50 A36 10 0 0 1 86 50" fill="none" stroke="'+INK+'" stroke-width="2" stroke-dasharray="4 4"/><ellipse cx="36" cy="36" rx="8" ry="5" fill="#fff8"/>'
};

const FVE={'kubus':[6,8,12],'kuboid':[6,8,12],'prisma segi empat sama':[6,8,12],'prisma segi tiga':[5,6,9],'piramid':[5,5,8],'piramid segi tiga':[4,4,6]};

/* ---------- simetri: paksi diuji dengan pantulan bucu ---------- */
const SYMSHAPES={
 'segi empat tepat':[[12,30],[88,30],[88,70],[12,70]],
 'segi empat sama':[[18,18],[82,18],[82,82],[18,82]],
 'segi tiga sama kaki':[[50,10],[80,88],[20,88]],
 'segi tiga sama sisi':regPoly(3,50,56,42),
 'pentagon sekata':regPoly(5,50,53,40),
 'heksagon sekata':regPoly(6,50,50,40,0),
 'lelayang':[[50,8],[80,38],[50,92],[20,38]],
 'rumah':[[20,46],[50,14],[80,46],[80,88],[20,88]],
 'segi empat selari':[[24,30],[90,30],[76,70],[10,70]]
};
const centroid=v=>[v.reduce((a,p)=>a+p[0],0)/v.length,v.reduce((a,p)=>a+p[1],0)/v.length];
function reflects(v,c,deg,off=0){const t=deg*Math.PI/180,dx=Math.cos(t),dy=Math.sin(t),nx=-dy,ny=dx,px=c[0]+nx*off,py=c[1]+ny*off;
 return v.every(p=>{const ax=p[0]-px,ay=p[1]-py,d=ax*dx+ay*dy,rx=px+2*d*dx-ax,ry=py+2*d*dy-ay;return v.some(q=>Math.hypot(q[0]-rx,q[1]-ry)<1)})}
function axes(name){const v=SYMSHAPES[name],c=centroid(v),out=[];for(let a=0;a<180;a+=15)if(reflects(v,c,a))out.push(a);return out}
function lineSeg(c,deg,off=0,L=50){const t=deg*Math.PI/180,dx=Math.cos(t),dy=Math.sin(t),px=c[0]-dy*off,py=c[1]+dx*off;return[px-dx*L,py-dy*L,px+dx*L,py+dy*L]}

/* ---------- rajah untuk pad ---------- */
function rectFig(w,h,lw,lh,unit){const sc=Math.min(150/w,80/h),W=w*sc,H=h*sc,x=(200-W)/2,y=(110-H)/2;
 return svg('0 0 200 120','<rect x="'+x+'" y="'+y+'" width="'+W+'" height="'+H+'" fill="#e6f2ff" '+SW+'/>'+
  '<text x="'+(x+W/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="13" fill="'+INK+'">'+lw+'</text>'+
  '<text x="'+(x+W+6)+'" y="'+(y+H/2+4)+'" font-size="13" fill="'+INK+'">'+lh+'</text>')}
function lFig(a,b,c,d,labels){ // bentuk L: lebar a, tinggi b, potong c×d dari penjuru kanan atas
 const sc=Math.min(120/a,84/b),W=a*sc,H=b*sc,x=Math.max(44,(200-W)/2),y=(118-H)/2+4,cw=c*sc,dh=d*sc;
 const P=[[x,y],[x+W-cw,y],[x+W-cw,y+dh],[x+W,y+dh],[x+W,y+H],[x,y+H]];
 const t=(px,py,s,anc='middle')=>'<text x="'+px+'" y="'+py+'" text-anchor="'+anc+'" font-size="12" fill="'+INK+'">'+s+'</text>';
 return svg('0 0 200 124','<polygon points="'+pts(P)+'" fill="#e6f2ff" '+SW+'/>'+t(x+(W-cw)/2,y-5,labels.top)+t(x-4,y+H/2+4,labels.left,'end')+t(x+W/2,y+H+14,labels.bottom)+t(x+W+4,y+dh+(H-dh)/2+4,labels.right,'start')+(labels.notch?t(x+W-cw+4,y+dh/2+4,labels.notch,'start'):''))}
function cubesFig(l,w,h){const s=Math.min(26,150/(l+w*.55),92/(h+w*.45)),ox=(200-(l+w*.55)*s)/2+w*.55*s,oy=112;let g='';
 const iso=(x,y,z)=>[ox+x*s-y*s*.55,oy-z*s-y*s*.45];
 for(let z=0;z<h;z++)for(let y=w-1;y>=0;y--)for(let x=0;x<l;x++){
  const p=iso(x,y,z),q=iso(x+1,y,z),r=iso(x+1,y,z+1),u=iso(x,y,z+1),r2=iso(x+1,y+1,z+1),u2=iso(x,y+1,z+1),q2=iso(x+1,y+1,z);
  g+='<polygon points="'+pts([p,q,r,u])+'" fill="#78a9ff" stroke="'+INK+'" stroke-width="1.4"/>';
  if(z===h-1)g+='<polygon points="'+pts([u,r,r2,u2])+'" fill="#cfe2ff" stroke="'+INK+'" stroke-width="1.4"/>';
  if(x===l-1)g+='<polygon points="'+pts([q,q2,r2,r])+'" fill="#4d7fd6" stroke="'+INK+'" stroke-width="1.4"/>'}
 return svg('0 0 200 120',g)}
function triFig(a,b){return svg('0 0 200 110','<polygon points="20,96 180,96 70,14" fill="#fff4cc" '+SW+'/><text x="34" y="90" font-size="13" fill="'+INK+'">'+a+'°</text><text x="150" y="90" font-size="13" fill="'+INK+'">'+b+'°</text><text x="64" y="40" font-size="14" fill="#a3283a">?</text>')}
function quadFig(a,b,c){return svg('0 0 200 110','<polygon points="22,96 178,96 150,18 50,24" fill="#fff4cc" '+SW+'/><text x="32" y="90" font-size="13" fill="'+INK+'">'+a+'°</text><text x="148" y="90" font-size="13" fill="'+INK+'">'+b+'°</text><text x="136" y="38" font-size="13" fill="'+INK+'">'+c+'°</text><text x="56" y="44" font-size="14" fill="#a3283a">?</text>')}
function protractor(cx,cy,R,labels=true){let g='<path d="M'+(cx-R)+' '+cy+' A'+R+' '+R+' 0 0 1 '+(cx+R)+' '+cy+' Z" fill="#fff4cc" stroke="'+INK+'" stroke-width="2.5"/>';
 for(let d=0;d<=180;d+=5){const t=(180-d)*Math.PI/180,big=d%10===0,r1=R-(d%30===0?13:big?8:5);g+='<line x1="'+(cx+R*Math.cos(t))+'" y1="'+(cy-R*Math.sin(t))+'" x2="'+(cx+r1*Math.cos(t))+'" y2="'+(cy-r1*Math.sin(t))+'" stroke="'+INK+'" stroke-width="'+(big?1.6:1)+'"/>';
  if(labels&&d%30===0)g+='<text x="'+(cx+(R-24)*Math.cos(t))+'" y="'+(cy-(R-24)*Math.sin(t)+4)+'" text-anchor="middle" font-size="10" fill="'+INK+'">'+d+'</text>'}

 return svg('0 0 200 112',protractor(cx,cy,R)+'<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R)+'" y2="'+cy+'" stroke="#a3283a" stroke-width="4" stroke-linecap="round"/><line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(t))+'" y2="'+(cy-R*Math.sin(t))+'" stroke="#a3283a" stroke-width="4" stroke-linecap="round"/>')}
function circleFig(r,show){const R=44;let g='<circle cx="100" cy="58" r="'+R+'" fill="#e6f2ff" '+SW+'/><circle cx="100" cy="58" r="3" fill="'+INK+'"/>';
 if(show==='d')g+='<line x1="56" y1="58" x2="144" y2="58" stroke="#a3283a" stroke-width="3"/><text x="100" y="52" text-anchor="middle" font-size="13" fill="#a3283a">'+r+'</text>';
 else g+='<line x1="100" y1="58" x2="144" y2="58" stroke="#a3283a" stroke-width="3"/><text x="122" y="52" text-anchor="middle" font-size="13" fill="#a3283a">'+r+'</text>';

function gridFig(W,H,marks,extra=''){const c=Math.min(170/W,92/H),ox=22,oy=100;let g='';
 for(let i=0;i<=W;i++)g+='<line x1="'+(ox+i*c)+'" y1="'+(oy)+'" x2="'+(ox+i*c)+'" y2="'+(oy-H*c)+'" stroke="#c9d6ea"/><text x="'+(ox+i*c)+'" y="'+(oy+11)+'" text-anchor="middle" font-size="8" fill="'+INK+'">'+i+'</text>';
 for(let j=0;j<=H;j++)g+='<line x1="'+ox+'" y1="'+(oy-j*c)+'" x2="'+(ox+W*c)+'" y2="'+(oy-j*c)+'" stroke="#c9d6ea"/><text x="'+(ox-6)+'" y="'+(oy-j*c+3)+'" text-anchor="end" font-size="8" fill="'+INK+'">'+j+'</text>';
 g+=extra;marks.forEach(m=>{g+='<circle cx="'+(ox+m.x*c)+'" cy="'+(oy-m.y*c)+'" r="5" fill="'+(m.c||'#ffd24b')+'" stroke="'+INK+'" stroke-width="2"/><text x="'+(ox+m.x*c+7)+'" y="'+(oy-m.y*c-5)+'" font-size="11" fill="'+INK+'">'+m.l+'</text>'});
 return svg('0 0 200 114',g)}

/* ---------- penjana soalan ikut archetype bank soalan app ----------
   Setiap fungsi pulangkan {q, sub?, w:{…alat}, ok(jawapan), ans, s, a}.          */
const optPick=(opts,correct,txt)=>({type:'pick',txt,opts:shuffle(opts),correct});
const padQ=(fig,unit,val)=>({type:'pad',fig,unit,val});
const NAMES2D_1=['bulatan','segi tiga','segi empat sama','segi empat tepat'];
const NAMES2D_2=[...NAMES2D_1,'pentagon','heksagon','semi bulatan'];
const SOLIDS1=['kubus','kuboid','silinder','kon','sfera'],SOLIDS2=[...SOLIDS1,'piramid'];
const REG=['pentagon','heksagon','heptagon','oktagon'];
function identify2d(list){const t=pick(list),o=shuffle(list.filter(x=>x!==t)).slice(0,3);
 return{q:'Cari bentuk '+t+'.',w:optPick([t,...o].map(n=>({id:n,html:sh2(n)})),t),ans:t,s:'Lihat bilangan sisi dan bucu setiap bentuk.',a:'Itu '+t+(SIDES[t]>1?' ('+SIDES[t]+' sisi)':'')+'.'}}
/* "Jom tengok cara": q.wk holds the small steps a pupil picks one by one (js/minigame-worked-v1.js). */
const WL=(say,right,wrongs,line,o={})=>({say,right,wrongs,line,...o});
const fx=(op,a,b)=>({fact:{op,a,b}});
const mulW=(a,b,lab,o)=>WL(a+' × '+b+' = ?',a*b,[a*b+a,a+b,a*b+b],(lab?lab+' = ':'')+(a*b),{...fx('mul',a,b),...o});
const divW=(a,b,lab,o)=>WL(a+' ÷ '+b+' = ?',a/b,[a/b+1,a/b>1?a/b-1:a/b+2,a-b],(lab?lab+' = ':'')+(a/b),{...fx('div',a,b),...o});
const addW=(xs,lab,o)=>{const t=xs.reduce((a,b)=>a+b,0);return WL(xs.join(' + ')+' = ?',t,[t+1,t-1,t+10],(lab?lab+' = ':'')+t,{...(xs.length===2?fx('add',xs[0],xs[1]):{}),...o})};
const subW=(a,b,lab,o)=>WL(a+' − '+b+' = ?',a-b,[a-b+1,a-b>1?a-b-1:a-b+2,a+b],(lab?lab+' = ':'')+(a-b),{...fx('sub',a,b),...o});
const cntW=(say,n,line)=>WL(say,n,[n+1,n>1?n-1:n+2],line+': '+n);
/* Faces, vertices or edges (k = 0, 1, 2) of a prism or pyramid, counted from its base. */
function solidW(t,k){const pyr=/^piramid/.test(t),n=t==='piramid segi tiga'||t==='prisma segi tiga'?3:4,nm=['permukaan','bucu','tepi'][k];
 const L=pyr?[[cntW('Tapak: berapa permukaan?',1,'Tapak'),cntW('Permukaan segi tiga: satu pada setiap sisi tapak. Berapa?',n,'Segi tiga'),addW([1,n],'Permukaan')],
   [cntW('Tapak ada berapa bucu?',n,'Bucu tapak'),addW([n,1],'Bucu',{say:'Tambah 1 bucu di puncak. '+n+' + 1 = ?'})],
   [cntW('Tapak ada berapa tepi?',n,'Tepi tapak'),addW([n,n],'Tepi',{say:'Setiap bucu tapak ada satu tepi ke puncak. '+n+' + '+n+' = ?'})]][k]
  :[[cntW('Tapak di kedua-dua hujung: berapa?',2,'Tapak'),cntW('Sisi tegak: satu pada setiap sisi tapak. Berapa?',n,'Sisi tegak'),addW([2,n],'Permukaan')],
   [cntW('Satu tapak ada berapa bucu?',n,'Bucu satu tapak'),mulW(n,2,'Bucu',{say:'Ada 2 tapak. '+n+' × 2 = ?'})],
   [cntW('Satu tapak ada berapa tepi?',n,'Tepi satu tapak'),mulW(n,2,'Tepi 2 tapak',{say:'Ada 2 tapak. '+n+' × 2 = ?'}),addW([2*n,n],'Tepi',{say:'Tambah '+n+' tepi tegak. '+2*n+' + '+n+' = ?'})]][k];
 return{lines:L,value:FVE[t][k]}}
const GEN={
 /* D1–D2: bentuk 2D & 3D */
 identify2d:g=>identify2d(g===1?NAMES2D_1:NAMES2D_2),
 property2d:g=>{const t=pick(g===1?['segi tiga','segi empat sama','segi empat tepat']:['segi tiga','segi empat tepat','pentagon','heksagon']),what=pick(['sisi','bucu']);
  return{q:'Berapa '+what+' ada pada bentuk ini?',sub:'Ini '+t+'.',w:padQ(sh2(t),what,SIDES[t]),ans:SIDES[t]+' '+what,s:'Sentuh setiap '+what+' dengan jari dan kira.',a:t+' ada '+SIDES[t]+' '+what+'.'}},
 identify3d:g=>{const L=g===1?SOLIDS1:SOLIDS2,t=pick(L),o=shuffle(L.filter(x=>x!==t)).slice(0,3);
  return{q:'Cari bentuk '+t+'.',w:optPick([t,...o].map(n=>({id:n,html:sh3(n)})),t),ans:t,s:{kubus:'Kubus: semua permukaan segi empat sama.',kuboid:'Kuboid: seperti kotak, lebih panjang.',silinder:'Silinder: seperti tin, dua bulatan.',kon:'Kon: satu bucu tajam dan tapak bulat.',sfera:'Sfera: bulat seperti bola.',piramid:'Piramid: permukaan segi tiga bertemu di puncak.'}[t],a:'Itu '+t+'.'}},
 faces3d:()=>{const t=pick(Object.keys(FLAT));return{wk:FVE[t]&&solidW(t,0),q:'Berapa permukaan rata pada '+t+'?',w:padQ(sh3(t),'permukaan',FLAT[t]),ans:FLAT[t]+' permukaan rata',s:'Permukaan rata tidak melengkung. Bayangkan bentuk ini di atas meja.',a:t+' ada '+FLAT[t]+' permukaan rata.'}},
 pattern2d:()=>patternQ(['segi tiga','bulatan','segi empat sama','segi empat tepat'],S2),
 /* D3 7.1 prisma */
