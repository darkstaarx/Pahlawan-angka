<meta charset="utf-8">
<title>Pos Peninjau Wira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one cosy phone-width stall — market scene on top, cooking-game station below that swaps per step (Ambil → Kira → Serah). Single warm daytime look, both host themes. */
:root{
  --sky:#2b4a66;         /* page ground behind the stall */
  --wood:#9a5f34;        /* stall timber */
  --wood-dk:#5e3519;
  --wood-lt:#d79a5c;
  --paper:#fff6e0;       /* parchment panels */
  --paper-dk:#f1dcae;
  --ink:#4a2a16;         /* text on parchment */
  --ink-soft:#8a6142;
  --leaf:#4f9a4a;        /* go / correct */
  --leaf-dk:#2f6a2e;
  --berry:#d2536b;       /* gentle wrong */
  --gold:#ffc94a;        /* coins, stars */
  --gold-dk:#b9801c;
  --ice:#7fd6f0;         /* Wira accent */
  --cream:#fffdf6;
  --f-display:"Baloo 2","Trebuchet MS",Verdana,sans-serif;
  --f-body:"Nunito","Trebuchet MS",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#3d6584,var(--sky) 70%);font-family:var(--f-body);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.pa-game{position:relative;width:100%;max-width:470px;height:100%;max-height:940px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(180deg,#f7e4bd,#ecd09b);overflow:hidden;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 0 40px #0b1a2a88}
.pa-game>*{flex:none}

/* ---------- HUD: wooden plank ---------- */
.hud{position:relative;z-index:6;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:7px 10px 8px;background:repeating-linear-gradient(90deg,transparent 0 118px,#00000018 118px 120px),linear-gradient(180deg,var(--wood-lt),var(--wood) 55%,#82491f);border-bottom:4px solid var(--wood-dk);box-shadow:0 3px 0 #0003}
.clock{display:flex;align-items:center;gap:7px;background:var(--paper);border:2px solid var(--wood-dk);border-radius:14px;padding:3px 9px 3px 4px;box-shadow:inset 0 -3px 0 var(--paper-dk)}
.dial{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,25%),#e9cf98 0);display:grid;place-items:center;border:2px solid var(--gold-dk)}
.dial::after{content:"";width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff6b8,#ffb52e);box-shadow:0 0 6px #ffd35a}
.clock b{display:block;font:800 13px/1 var(--f-display);color:var(--ink)}
.clock small{display:block;font:800 10px/1.2 var(--f-body);color:var(--ink-soft)}
.title{text-align:center;min-width:0}
.title small{display:block;font:900 8px/1 var(--f-body);letter-spacing:1.1px;white-space:nowrap;color:#ffe9bf;opacity:.9}
.title b{display:block;font:800 clamp(15px,4.4vw,19px)/1.05 var(--f-display);overflow:hidden;text-overflow:ellipsis;color:#fff4d1;text-shadow:0 2px 0 var(--wood-dk),0 0 1px var(--wood-dk);white-space:nowrap}
.hud-right{display:flex;align-items:center;gap:6px}
.till{display:flex;align-items:center;gap:5px;background:var(--paper);border:2px solid var(--wood-dk);border-radius:14px;padding:4px 8px 4px 5px;font:800 13px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums;box-shadow:inset 0 -3px 0 var(--paper-dk)}
.till img{width:22px;height:auto;display:block;margin:-3px 0}
.till.bump{animation:bump .5s}
.icon-btn{width:36px;height:36px;border-radius:12px;border:2px solid var(--wood-dk);background:var(--paper);font-size:16px;cursor:pointer;box-shadow:inset 0 -3px 0 var(--paper-dk)}

/* ---------- Scene ---------- */
.scene{position:relative;flex:1 1 auto!important;min-height:140px;container-type:size;overflow:hidden;background:#cbb49a url("assets/minigames/kedai-ajaib/pasar-bg.webp") 58% 62%/cover no-repeat}
.scene::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#0002);pointer-events:none}
.tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;transition:background 1.2s,opacity 1.2s}
.awning{position:absolute;top:0;left:-6px;right:-6px;height:46px;z-index:4;background:repeating-linear-gradient(90deg,#e8604f 0 34px,#fff1d6 34px 68px);-webkit-mask:radial-gradient(circle 17px at 17px 29px,#000 98%,transparent) 0 0/34px 46px repeat-x,linear-gradient(#000,#000) 0 0/100% 29px no-repeat;mask:radial-gradient(circle 17px at 17px 29px,#000 98%,transparent) 0 0/34px 46px repeat-x,linear-gradient(#000,#000) 0 0/100% 29px no-repeat;filter:drop-shadow(0 4px 0 #0003)}
.awning-rod{position:absolute;top:0;left:0;right:0;height:9px;z-index:5;background:linear-gradient(180deg,var(--wood-lt),var(--wood-dk))}
.sign{position:absolute;z-index:5;top:30px;left:12px;padding:4px 10px 5px;background:linear-gradient(180deg,#a9673a,#7a4422);border:2px solid #f6d48d;border-radius:8px;transform:rotate(-4deg);box-shadow:0 3px 0 #0004}
.sign b{font:800 13px/1 var(--f-display);color:#ffefb8;letter-spacing:.5px}
.sign::before,.sign::after{content:"";position:absolute;top:-30px;width:2px;height:30px;background:#5e3519}
.sign::before{left:16px}.sign::after{right:16px}

.wira{position:absolute;z-index:2;left:4px;bottom:44px;width:clamp(84px,44cqh,122px);animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
.wira img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 3px #0005)}
.wira.cheer{animation:hop .55s ease 2}
.counter{position:absolute;z-index:3;left:0;bottom:0;width:62%;height:56px;background:repeating-linear-gradient(90deg,transparent 0 62px,#0000001f 62px 64px),linear-gradient(180deg,#e2a466 0 10px,var(--wood) 10px,#7b4520);border-top:4px solid #f0bf82;border-right:4px solid var(--wood-dk);border-radius:0 10px 0 0;box-shadow:inset 0 10px 0 #ffffff22,0 -2px 0 #0002}
.counter::after{content:"";position:absolute;left:10px;right:14px;top:22px;height:2px;background:#0000002a;box-shadow:0 18px #0000002a}
.basket{position:absolute;z-index:4;left:clamp(98px,48cqh,128px);bottom:32px;width:80px;height:54px}
.basket .bag{position:absolute;inset:auto 0 0 0;height:44px;border-radius:5px 5px 10px 10px;background:linear-gradient(180deg,#e7c287,#c99a5a);border:2px solid #8a5c2b;box-shadow:inset 0 6px 0 #ffffff33}
.basket .bag::before{content:"";position:absolute;left:8px;right:8px;top:-1px;height:5px;background:repeating-linear-gradient(90deg,#8a5c2b 0 5px,transparent 5px 9px);opacity:.5}
.basket .in{position:absolute;z-index:1;left:4px;right:4px;bottom:26px;display:flex;justify-content:center;align-items:flex-end;gap:0}
.basket .in svg{width:34px;height:34px;margin:0 -5px;filter:drop-shadow(0 2px 1px #0004);animation:plop .35s ease}
.basket.wiggle{animation:wiggle .4s}

.customer{position:absolute;z-index:3;right:-6px;bottom:4px;width:clamp(118px,60cqh,170px);transition:transform .9s cubic-bezier(.3,1.2,.5,1),opacity .4s}
.customer img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 4px #0004);animation:bob 1.9s ease-in-out infinite}
.customer.away{transform:translateX(120%);opacity:0}
.customer.leave{transform:translateX(130%) translateY(-6px);opacity:0;transition:transform .8s ease-in,opacity .8s}
.customer.sadshake img{animation:shake .45s}

.bubble{position:absolute;z-index:6;right:10px;top:40px;max-width:56%;background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:7px 11px 8px;box-shadow:0 4px 0 #0003;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .25s;transform-origin:80% 100%}
.bubble.dim{opacity:.12}
.bubble.hide{transform:scale(.4);opacity:0}
.bubble::after{content:"";position:absolute;right:46px;bottom:-14px;width:18px;height:18px;background:var(--cream);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg);border-radius:0 0 5px 0}
.bubble .who{font:900 9.5px/1 var(--f-body);letter-spacing:1px;color:var(--berry);text-transform:uppercase}
.bubble .say{font:800 12.5px/1.22 var(--f-body);margin-top:3px;text-wrap:balance}
.bubble .order{display:flex;gap:4px;margin-top:5px}
.bubble .order span{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#fbeacb;border:2px dashed #d7b47e}
.bubble .order svg{width:27px;height:27px}
.bubble .cash{display:inline-flex;margin-top:5px}

.wsay{position:absolute;z-index:7;left:8px;top:58px;max-width:44%;background:#eaf9ff;border:3px solid #24577c;border-radius:16px;padding:7px 10px;font:800 12px/1.3 var(--f-body);color:#173a57;box-shadow:0 4px 0 #0003;transform-origin:20% 100%;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.wsay.hide{transform:scale(.4);opacity:0;pointer-events:none}
.wsay b{display:block;font:900 9px/1 var(--f-body);letter-spacing:1px;color:#2f7bb0;margin-bottom:3px}
.wsay::after{content:"";position:absolute;left:34px;bottom:-12px;width:14px;height:14px;background:#eaf9ff;border-right:3px solid #24577c;border-bottom:3px solid #24577c;transform:rotate(45deg)}

.stamp{position:absolute;z-index:9;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-10deg) scale(2.4);opacity:0;pointer-events:none;text-align:center;font:800 44px/0.9 var(--f-display);letter-spacing:1px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.stamp small{display:block;font:900 14px/1.2 var(--f-body);-webkit-text-stroke:0;text-shadow:none;color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:20px;padding:3px 12px;margin:8px auto 0;width:max-content;letter-spacing:.5px}
.stamp.show{animation:stampIn .55s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp.hebat{color:#ffd23f}.stamp.bagus{color:#7fe08a}.stamp.ok{color:#8fd3ff}
.burst{position:absolute;inset:0;z-index:8;pointer-events:none}
.burst i{position:absolute;left:50%;top:44%;width:10px;height:10px;border-radius:2px;animation:burst 1s ease-out forwards}

/* ---------- Station ---------- */

.banner{margin:8px 12px 0;position:relative;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:6px 12px 7px 7px;background:var(--berry);color:#fff;border-radius:12px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.banner>div{min-width:0}
.disc{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--cream);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:3px 7px 4px}
.disc b{font:800 9px/1 var(--f-body)!important;letter-spacing:.8px;color:var(--ink-soft)}
.disc .dots{display:flex;gap:3px}
.disc .dots i{width:9px;height:9px;border-radius:50%;background:#e6c58c;border:1.5px solid var(--ink)}
.disc .dots i.done{background:var(--leaf)}
.disc .dots i.now{background:var(--gold)}
.disc em{font:800 13px/1 var(--f-display);font-style:normal}
.banner b{display:block;font:800 16px/1.05 var(--f-display);text-wrap:balance}
.banner>div>span{display:block;font:700 11.5px/1.3 var(--f-body);opacity:.95;margin-top:2px}
.banner .tag{position:absolute;right:10px;top:-11px;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:2px 8px;font:900 9.5px/1.2 var(--f-body);letter-spacing:.8px}

.panel{margin:8px 12px 0;padding:8px 10px 10px;min-height:224px;background:var(--paper);border:3px solid var(--wood-dk);border-radius:16px;box-shadow:inset 0 -5px 0 var(--paper-dk),0 4px 0 #0002}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.panel-h b{font:800 15px/1 var(--f-display)}
.panel-h small{font:800 10.5px/1.2 var(--f-body);color:var(--ink-soft)}

/* shelf */
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:84px;gap:6px 6px;margin:0 -4px;padding:0 4px;background:repeating-linear-gradient(180deg,transparent 0 40px,var(--wood-lt) 40px 43px,var(--wood) 43px 47px,var(--wood-dk) 47px 49px,transparent 49px 90px)}
.item{position:relative;z-index:1;appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;touch-action:manipulation}
.item .art{width:46px;height:42px;display:grid;place-items:end center;transition:transform .15s}
.item .art svg{width:42px;height:42px;filter:drop-shadow(0 3px 1px #0003)}
.item:active .art{transform:scale(.9)}
.item .tagp{position:relative;font:800 11px/1 var(--f-body);color:var(--ink);background:var(--cream);border:2px solid var(--ink);border-radius:5px 12px 12px 5px;padding:3px 7px 3px 9px;font-variant-numeric:tabular-nums}
.item .tagp::before{content:"";position:absolute;left:3px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--ink)}
.item .nm{font:800 10.5px/1.1 var(--f-body);color:var(--ink-soft);text-align:center;white-space:nowrap}
.item.picked .art{transform:translateY(-4px)}
.item.picked .art::after{content:"✓";position:absolute;margin:-34px 0 0 38px;width:20px;height:20px;border-radius:50%;background:var(--leaf);color:#fff;font:900 12px/20px var(--f-body);text-align:center;border:2px solid #fff}
.item.glow .art{animation:glow 1s ease-in-out infinite}

/* receipt + mat */
.receipt{background:#fff;border-radius:6px;padding:5px 9px 6px;font:700 12px/1.45 var(--f-body);color:var(--ink);border:2px dashed #d9c39a;font-variant-numeric:tabular-nums;position:relative}
.receipt .row{display:flex;justify-content:space-between;gap:8px}
.receipt .row svg{width:16px;height:16px;vertical-align:-3px;margin-right:3px}
.receipt .items{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));column-gap:14px}
.receipt .sumline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;border-top:2px dashed #d9c39a;margin-top:3px;padding-top:3px;font-weight:900}
.receipt .sum{border-top:2px dashed #d9c39a;margin-top:4px;padding-top:4px;font-weight:900}
.receipt .q{display:inline-block;min-width:44px;text-align:center;background:#fbeacb;border-radius:6px;color:var(--berry)}
.receipt .paid{color:var(--leaf-dk)}
.mat{margin-top:7px;min-height:52px;border-radius:12px;background:repeating-linear-gradient(45deg,#3f7d4a 0 6px,#45864f 6px 12px);border:3px solid #2a5a33;box-shadow:inset 0 3px 6px #0004;padding:8px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;position:relative}
.mat-empty{position:absolute;inset:0;display:grid;place-items:center;color:#cfe8cf;font:800 12px/1.3 var(--f-body);text-align:center;padding:0 20px;pointer-events:none}
.mat-total{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font:800 12px/1 var(--f-body);color:var(--ink-soft)}
.mat-total b{font:800 18px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.mat-total button{background:none;border:0;font:800 11.5px/1 var(--f-body);color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:6px 2px}

.purse{display:flex;justify-content:space-between;align-items:flex-end;gap:4px;margin-top:4px;padding:7px 6px 5px;background:linear-gradient(180deg,#8b5530,#6d3e1f);border-radius:14px;border:3px solid var(--wood-dk);box-shadow:inset 0 4px 0 #ffffff1c}
.money{appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;touch-action:manipulation;flex:1;min-width:0}
.money small{font:800 10px/1 var(--f-body);color:#ffe7bd;white-space:nowrap}
.mat .tok{appearance:none;border:0;background:none;padding:0;cursor:pointer;animation:drop .3s cubic-bezier(.3,1.6,.5,1)}
.cash{display:block;height:auto;max-width:none;filter:drop-shadow(0 2px 1px #0006);transition:transform .1s}
.money:active .cash{transform:translateY(2px) scale(.94)}
.cash.c10{width:36px}.cash.c20{width:39px}.cash.c50{width:42px}.cash.n{width:60px}
.mat .tok .cash.c10{width:30px}.mat .tok .cash.c20{width:33px}.mat .tok .cash.c50{width:36px}.mat .tok .cash.n{width:52px}
.bubble .order .paid-note{width:auto;padding:0 3px;border-style:solid;border-color:#9fca8e;background:#e6f2d4}
.bubble .order .paid-note img{width:52px;height:auto;display:block}
.mat{gap:4px}

.actions{display:flex;gap:9px;margin:9px 12px 0}
.btn{min-height:48px;border-radius:14px;border:3px solid var(--ink);font:800 16px/1 var(--f-display);cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.hint{width:34%;background:#eaf9ff;color:#173a57}
.btn.go{flex:1;background:linear-gradient(180deg,#7ccd6a,var(--leaf));color:#fff;text-shadow:0 2px 0 var(--leaf-dk)}
.btn.go[disabled]{filter:grayscale(.6) brightness(1.05);opacity:.7;cursor:default}

.devbtn{position:absolute;z-index:7;left:8px;bottom:6px;font:900 11px/1 var(--f-body);color:var(--ink);background:#fff8;border:2px dashed var(--ink);border-radius:10px;padding:5px 8px;cursor:pointer}
.qtyb{position:absolute;right:-6px;bottom:-6px;background:var(--berry);color:#fff;border:2px solid #fff;border-radius:10px;font:900 10px/1 var(--f-body);padding:2px 4px}
.bubble .order span{position:relative}
.basket .in{position:absolute}.basket .qtyb{right:-4px;bottom:-14px;font-size:11px}
.bubble .order .coupon{width:auto;padding:0 7px;background:#ffe27a;border:2px dashed var(--ink);font:800 15px/1 var(--f-display);color:var(--berry)}
.receipt .row.dsc{color:var(--berry)}.receipt .row.cost{color:var(--ink-soft)}
.receipt .items.one{grid-template-columns:1fr}
.signrow{display:flex;gap:6px;margin:-3px 0 -2px auto}
.signrow button{min-height:30px;padding:0 10px;border-radius:9px;border:2px solid var(--ink);background:var(--cream);font:800 13px/1 var(--f-display);cursor:pointer;color:var(--ink-soft)}
.signrow button[data-sign=untung].on{background:var(--leaf);color:#fff;box-shadow:inset 0 -3px 0 var(--leaf-dk)}
.signrow button[data-sign=rugi].on{background:var(--berry);color:#fff;box-shadow:inset 0 -3px 0 #8f2f43}
.overlay.dev{z-index:40;align-items:flex-end;padding:0}
.devsheet{width:100%;background:var(--cream);border-top:4px solid var(--ink);border-radius:18px 18px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:7px;max-height:92%;overflow:auto}
.devhead{display:flex;justify-content:space-between;align-items:center;font:900 9.5px/1 var(--f-body);letter-spacing:1px;color:var(--berry)}
.devhead button{border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink)}
.devsheet>b{font:800 18px/1 var(--f-display)}
.devsheet>small{font:900 10px/1 var(--f-body);letter-spacing:.8px;color:var(--ink-soft);text-transform:uppercase;margin-top:4px}
.devrow{display:flex;flex-wrap:wrap;gap:6px}
.devrow button{flex:1 1 auto;min-height:36px;border-radius:10px;border:2px solid #d7b47e;background:#fbeacb;font:800 13px/1 var(--f-body);cursor:pointer;padding:0 10px;color:var(--ink)}
.devrow button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.devrow.sims button{font-size:11.5px;flex:1 1 45%}
.devfoot{display:flex;gap:8px;align-items:center}.devfoot code{flex:1;font:700 12px/1.2 ui-monospace,monospace;color:var(--ink-soft);overflow-wrap:anywhere}.devfoot .btn{min-height:40px;padding:0 18px;font-size:15px}
.simout{margin:0;font:700 12px/1.4 var(--f-body);color:var(--ink);min-height:1.4em}
#simGo{min-height:42px;font-size:15px}
.hearts{display:flex;gap:2px;font-size:13px;letter-spacing:-1px}

/* ---------- Ledger (end of day) ---------- */
.overlay{position:absolute;inset:0;z-index:30;background:#2a1a0ecc;display:flex;align-items:center;justify-content:center;padding:50px 14px 16px;overflow:auto}
.ledger{width:100%;background:var(--paper);border:4px solid var(--wood-dk);border-radius:18px;padding:18px 16px 16px;box-shadow:inset 0 -6px 0 var(--paper-dk),0 14px 40px #0008;text-align:center;animation:rise .5s cubic-bezier(.3,1.4,.5,1)}
.ledger .sun{width:64px;height:64px;margin:-50px auto 4px;border-radius:50%;background:radial-gradient(circle,#ffe58a,#ff9a3d 70%);border:4px solid var(--wood-dk);box-shadow:0 0 0 6px #ffcf7a66}
.ledger h2{margin:0;font:800 26px/1 var(--f-display);text-wrap:balance}
.ledger p{margin:6px 0 12px;font:700 12.5px/1.45 var(--f-body);color:var(--ink-soft)}

@keyframes drop{from{transform:translateY(-14px) scale(.7);opacity:0}to{transform:none;opacity:1}}

@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

@keyframes flap{50%{transform:skewY(-8deg) scaleX(.92)}}
@keyframes pinIn{0%{transform:translateY(-30px) rotate(-20deg);opacity:0}70%{transform:translateY(3px) rotate(4deg);opacity:1}100%{transform:rotate(var(--r,-3deg))}}
.scene{background:linear-gradient(180deg,#8fd3ff 0%,#c8ecff 55%,#e9f7d8 100%)!important}
.scene::before{display:none}
.sun2{position:absolute;top:10px;right:22%;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff6b8,#ffcf4a 70%);box-shadow:0 0 18px #ffe58a}
.hills{position:absolute;left:-10%;right:-10%;bottom:20px;height:48%;background:radial-gradient(ellipse 40% 60% at 25% 100%,#7cc46a 98%,transparent),radial-gradient(ellipse 45% 70% at 80% 100%,#5faa55 98%,transparent),radial-gradient(ellipse 60% 40% at 50% 100%,#8fd27a 98%,transparent)}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(#6fb35d,#4f9a4a);border-top:3px solid #3f7f3a}
.tower{position:absolute;z-index:1;left:clamp(70px,36cqh,104px);bottom:22px;width:46px;height:62%;background:repeating-linear-gradient(0deg,transparent 0 16px,#5e3519 16px 19px),linear-gradient(90deg,#7a4422 0 5px,transparent 5px 41px,#7a4422 41px);}
.tower::before{content:"";position:absolute;left:-8px;right:-8px;top:-4px;height:16px;background:linear-gradient(#c98b57,#9a5f34);border:2px solid #5e3519;border-radius:3px}
.tower::after{content:"";position:absolute;left:-12px;right:-12px;top:-24px;height:22px;background:#d2536b;clip-path:polygon(50% 0,100% 100%,0 100%);border-bottom:2px solid #5e3519}
.tower .flag{position:absolute;left:20px;top:-46px;width:3px;height:24px;background:#5e3519}
.tower .flag::after{content:"";position:absolute;left:3px;top:0;width:18px;height:12px;background:#ffd036;clip-path:polygon(0 0,100% 50%,0 100%);transform-origin:0 50%;animation:flap 1.6s ease-in-out infinite}
.tower .scope{position:absolute;right:-14px;top:0;width:20px;height:7px;border-radius:3px;background:#3b4c66;transform:rotate(-14deg)}
.board{position:absolute;z-index:1;left:44%;right:8%;top:10px;height:min(46%,96px);background:linear-gradient(#c98b57,#a96a3a);border:3px solid #5e3519;border-radius:8px;box-shadow:0 4px 0 #0003;padding:3px 6px 5px;display:flex;flex-direction:column}
.board::before,.board::after{content:"";position:absolute;bottom:-40px;width:6px;height:40px;background:#5e3519;z-index:-1}
.board::before{left:14%}.board::after{right:14%}
.board>b{font:800 9.5px/1 var(--f-display);letter-spacing:1px;color:#ffe9bf;text-align:center;text-shadow:0 1px 0 #5e3519}
.pins{flex:1;display:flex;justify-content:space-around;align-items:center;gap:3px}
.pins .slot{flex:1;max-width:30px;aspect-ratio:3/4;border:2px dashed #ffe9bf88;border-radius:3px;position:relative}
.pins .slot.on{border:2px solid #5e3519;background:var(--pc,#fff6e0);--r:-3deg;transform:rotate(var(--r));box-shadow:0 2px 0 #0003}
.pins .slot:nth-child(2n).on{--r:4deg}
.pins .slot.on i{position:absolute;left:18%;right:18%;bottom:18%;top:30%;background:linear-gradient(90deg,#4f8dff 0 22%,transparent 22% 39%,#ff8a5c 39% 61%,transparent 61% 78%,#48c06a 78%);clip-path:polygon(0 40%,22% 40%,22% 100%,0 100%,0 40%,39% 10%,61% 10%,61% 100%,39% 100%,39% 10%,78% 55%,100% 55%,100% 100%,78% 100%)}
.pins .slot.on::before{content:"";position:absolute;top:-5px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#d2536b;border:1px solid #5e3519}
.pins .slot.pop{animation:pinIn .7s cubic-bezier(.3,1.6,.5,1) forwards}
.counter{position:absolute;z-index:3;left:0;bottom:0;width:56%;height:30px;background:repeating-linear-gradient(90deg,#9a5f34 0 6px,transparent 6px 26px),linear-gradient(transparent 0 6px,#7a4422 6px 12px,transparent 12px 100%)!important;border:none!important}
.scene .wira{left:4px;bottom:22px;z-index:2}
.scene .customer{bottom:4px;z-index:3}
.scene .bubble{top:auto;bottom:58%;max-width:52%}.scene .wsay{top:40px}
.scene .devbtn{bottom:auto;top:8px;left:6px;background:#fff8}
.ledger .faces{display:flex;justify-content:center;gap:4px;margin:4px 0 14px}.ledger .faces div{display:flex;flex-direction:column;align-items:center;font:900 11px/1.2 var(--f-body);color:var(--gold-dk)}.ledger .faces img{width:48px;height:48px;object-fit:contain}
.burst i{border-radius:50%}

/* ---------- visual data ---------- */
.panel.set{gap:5px}
.qcard{padding:6px 10px 8px;gap:3px;max-width:360px}.qcard b{font-size:clamp(15px,2.5dvh,19px)}
.qcard.lt{background:#fffcf0;border-color:#d7b47e;border-width:3px}.qcard.lt b{color:var(--ink)}.qcard.lt small{color:var(--berry)}
/* data mentah */
.raw{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:100%;max-width:340px;background:#fffcf0;border:2px dashed #d7b47e;border-radius:10px;padding:5px}

.raw .it svg{width:100%;height:100%}
.raw .it.tk svg{opacity:.35}.raw .it.tk::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font:900 18px/1 var(--f-display);color:var(--leaf-dk)}
/* gundalan */
.ttab{border-collapse:separate;border-spacing:0;background:#fff;border:2px solid #b9801c;border-radius:10px;overflow:hidden;min-width:250px}
.ttab th{background:#ffe9a8;font:900 10px/1 var(--f-body);color:var(--ink-soft);text-transform:uppercase;padding:4px 10px;text-align:left}
.ttab td{border-top:1.5px solid #f1dcae;padding:3px 10px;font:800 13px/1.1 var(--f-body);color:var(--ink);height:28px}
.ti{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-right:5px}.ti svg{width:100%;height:100%}
.tg{height:1.5em;width:1.8em;margin-right:4px;vertical-align:middle}
.tz{color:#c9a46a;font-weight:900}
/* piktograf */
.pict{background:#fff;border:2px solid #b9801c;border-radius:10px;padding:4px 8px;display:flex;flex-direction:column;gap:2px;min-width:260px;max-width:360px}

.prow .ps{display:flex;gap:2px;flex-wrap:wrap}.prow .ps svg{width:20px;height:20px}
.pict.mini .prow{min-height:20px}.pict.mini .prow .ps svg{width:16px;height:16px}
.pkey{display:flex;align-items:center;gap:4px;justify-content:flex-end;font:900 12px/1 var(--f-body);color:var(--berry)}.pkey svg{width:18px;height:18px}
/* carta palang */
.chart{display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto;column-gap:4px;width:100%;max-width:330px}
.yax{position:relative;height:clamp(92px,17dvh,140px)}
.yax i{position:absolute;right:0;transform:translateY(50%);font:800 9.5px/1 var(--f-body);font-style:normal;color:var(--ink-soft)}
.plot{position:relative;height:clamp(92px,17dvh,140px);display:grid;grid-template-columns:repeat(var(--k),1fr);gap:8%;padding:0 4%;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);background:repeating-linear-gradient(to top,#d9c49a 0 1px,transparent 1px calc(100% / var(--n))) #fffcf0}
.plot .col{display:flex;flex-direction:column-reverse;align-items:stretch;height:100%}
.plot .bar{display:block;border:2px solid var(--ink);border-bottom:none;border-radius:4px 4px 0 0}
.plot .cell{flex:1;border:1px dashed #c9a46a55;background:transparent;padding:0;cursor:pointer;margin:0;border-radius:0}
.plot .cell.on{border:1.5px solid var(--ink)}
.plot .col.bad{outline:2px solid #c0392b;outline-offset:1px;background:#fde3e655}
.xl{display:grid;grid-template-columns:repeat(var(--k),1fr);gap:8%;padding:2px 4% 0}
.xl span{font:800 10.5px/1.1 var(--f-body);color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* kad data */
.cards{display:flex;flex-direction:column;gap:4px;align-items:center;width:100%}
.crow,.srow{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:36px}

/* beg guli */
.bags{display:flex;gap:10px;justify-content:center;width:100%}
.bag{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}

<script>
(()=>{
'use strict';
const DEV_ENABLED=window.PAMiniGameDev?.enabled?.()===true;
/* ---------- pembantu ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=k=>Array.from({length:k},(_,i)=>i);
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const nf=n=>{const s=String(n);return Math.abs(n)>=10000?s.replace(/\B(?=(\d{3})+(?!\d))/g,' '):s};
const sum=a=>a.reduce((x,y)=>x+y,0);
function opts(list,correct,max=3){const c=String(correct),L=[...new Set(list.map(String))].filter(x=>x!==c),T=shuffle([c,...shuffle(L).slice(0,max-1)]);return{opts:T.map((l,i)=>({id:'o'+i,label:l})),correct:'o'+T.indexOf(c)}}
const NUM=(v,o)=>({fields:[{v,...(o||{})}]});
const YN=(truth)=>({opts:[{id:'Y',label:'Betul'},{id:'N',label:'Salah'}],correct:truth?'Y':'N',ansTxt:truth?'Betul':'Salah'});
/* set kategori: [nama, ikon] */
const SETS={
 buah:[['Epal','apple'],['Oren','orange'],['Pisang','banana'],['Mangga','mango'],['Jambu','guava']],
 kuih:[['Karipap','karipap'],['Pau','pau'],['Kuih lapis','lapis'],['Donut','donut']],
 guli:[['Merah','gR'],['Biru','gB'],['Hijau','gG'],['Kuning','gY']],
 alat:[['Buku','book'],['Pensel','pencil'],['Pemadam','eraser'],['Pembaris','ruler']],
 hari:[['Isnin'],['Selasa'],['Rabu'],['Khamis'],['Jumaat']],
 sukan:[['Bola'],['Badminton'],['Renang'],['Larian'],['Catur']]};
const cats=(set,k)=>shuffle(SETS[set]).slice(0,k);
const catsOrd=(set,k)=>SETS[set].slice(0,k);
/* nilai berbeza (supaya paling banyak/sedikit unik) */
function vals(k,lo,hi,step=1){const pool=shuffle(range(Math.floor((hi-lo)/step)+1).map(i=>lo+i*step));return pool.slice(0,k)}
const top=(v,step)=>Math.max(step*4,Math.ceil(Math.max(...v)/step)*step);
const argmax=v=>v.indexOf(Math.max(...v)),argmin=v=>v.indexOf(Math.min(...v));
const tallyTxt=n=>(n>=5?'5 + ':'')+(n>=10?'5 + ':'')+(n>=15?'5 + ':'')+(n>=20?'5 + ':'');
const SCALE=['mustahil','kecil kemungkinan','sama kemungkinan','besar kemungkinan','pasti'];
const SC=i=>({scale:1,opts:SCALE.map((l,j)=>({id:'s'+j,label:l})),correct:'s'+i,ansTxt:SCALE[i]});
const NAMES=['Aina','Bala','Chong','Dina','Ezra','Farid','Mei Ling','Siva'];

/* "Jom tengok cara" lines (PAWorked.buildList): read the chart row by row, then work it out. */
const WL=(say,right,wrongs,line,o={})=>({say,right,wrongs,line,...o});
const fx=(op,a,b)=>({fact:{op,a,b}});
const rdT=(n,v,j)=>WL('Kira gundalan '+n+'. (||||/ = 5)',v,[v+1,v-1,v+5],n+' = '+v,{hl:[j]});
function tallyL(n,v,j){const g=Math.floor(v/5),r=v%5;if(g<1)return[WL('Kira gundalan '+n+' satu-satu.',v,[v+1,v-1,v+2],n+' = '+v,{hl:[j]})];
 return[WL('Kira ikatan ||||/ dalam baris '+n+'.',g,[g+1,g>1?g-1:g+2,v],n+': '+g+' ikat',{hl:[j]}),WL('Satu ikat = 5. '+g+' × 5 = ?',g*5,[g*5+5,g+5,g*5-1],g+' × 5 = '+g*5,fx('mul',g,5)),
  ...(r?[WL('Tambah '+r+' gundalan yang tinggal: '+g*5+' + '+r+' = ?',v,[v+1,v-1,g*5],n+' = '+v,fx('add',g*5,r))]:[])]}
const rdB=(n,v,j,st)=>WL('Ikut hujung palang '+n+' ke paksi nombor. Nilainya?',v,[v+st,v-st,v+2*st],n+' = '+nf(v),{hl:[j]});
const rdP=(n,c,j,k)=>k===1?WL('Kira gambar dalam baris '+n+'.',c,[c+1,c-1,c+2],n+' = '+c,{hl:[j]}):WL('Kira ★ dalam baris '+n+'.',c,[c+1,c-1,c*k],n+': '+c+' ★',{hl:[j]});
function pictL(n,c,j,k){return k===1?[rdP(n,c,j,1)]:[rdP(n,c,j,k),WL('Satu ★ = '+k+'. '+c+' × '+k+' = ?',c*k,[c+k,c*k+k,c*k-k],n+' = '+c+' × '+k+' = '+nf(c*k),fx('mul',c,k))]}
const addL=(xs,lab='Jumlah')=>{const t=sum(xs);return WL(xs.map(nf).join(' + ')+' = ?',t,[t+1,t-1,t+10],lab+' = '+nf(t),xs.length===2?fx('add',xs[0],xs[1]):{})};
const subL=(a,b,lab='Beza')=>WL(nf(a)+' − '+nf(b)+' = ?',a-b,[a-b+1,a-b-1,a+b],lab+' = '+nf(a)+' − '+nf(b)+' = '+nf(a-b),fx('sub',a,b));
const mulL=(a,b,lab)=>WL(nf(a)+' × '+nf(b)+' = ?',a*b,[a*b+a,a+b,a*b-b],(lab?lab+' = ':'')+nf(a)+' × '+nf(b)+' = '+nf(a*b),fx('mul',a,b));
const divL=(a,b,lab)=>WL(nf(a)+' ÷ '+nf(b)+' = ?',a/b,[a/b+1,a/b-1,a-b],(lab?lab+' = ':'')+nf(a)+' ÷ '+nf(b)+' = '+nf(a/b),fx('div',a,b));
const Fx={
 /* ---------- gundalan ---------- */
 readTally:(arch,set,lo,hi)=>({arch,f:C=>{const c=cats(set,3),v=vals(3,lo,hi),i=R(0,2);return{wk:{lines:tallyL(c[i][0],v[i],i),value:v[i]},kind:'pad',vis:{t:'tally',rows:c.map((x,j)=>[x[0],x[1],v[j]])},form:NUM(v[i]),
  q:'Berapakah bilangan '+c[i][0]+'?',s:'Satu ikat gundalan ||||/ = 5. Kira ikatan dahulu, kemudian gundalan yang tinggal.',a:v[i]>=5?tallyTxt(v[i])+(v[i]%5)+' = '+v[i]:'Kira satu-satu gundalan '+c[i][0]+'.'}}}),
 tallyBuild:(arch,set,k,lo,hi)=>({arch,f:C=>{const c=cats(set,k),v=vals(k,lo,hi),items=shuffle(c.flatMap((x,j)=>range(v[j]).map(()=>x[1])));return{kind:'tally',vis:{t:'raw',items},build:{rows:c},need:v,
  q:'Asingkan dan kira data '+(set==='guli'?'guli':set==='kuih'?'jualan kuih':'buah')+' ini. Buat gundalan bagi setiap jenis.',sub:'Ketik item untuk tanda ✓. Tekan + untuk tambah gundalan.',s:'Kira satu jenis pada satu masa. Tanda ✓ setiap item yang sudah dikira supaya tidak terkira dua kali.',a:'',hint2:'Mula dengan '+c[0][0]+': ketik setiap '+c[0][0].toLowerCase()+' sambil tekan + sekali untuk setiap satu.'}}}),
 completeTally:(arch)=>({arch,f:C=>{const c=cats('kuih',3),v=[R(2,5),R(1,3),R(1,3)],list=shuffle(c.flatMap((x,j)=>range(v[j]).map(()=>x[0])));return{kind:'pad',card:'Jualan kantin: '+list.join(', '),form:NUM(v[0],{post:'gundalan'}),
  q:'Berapa gundalan perlu dilukis untuk '+c[0][0]+'?',s:'Satu gundalan untuk setiap '+c[0][0]+' dalam senarai.',a:'Kira '+c[0][0]+' dalam senarai: 1 + 1 + … = ?'}}}),
 classify:(arch)=>({arch,f:C=>{const V=pick([['rambutan, mangga, rambutan, pisang','jenis buah',['warna baju','umur murid','nama hari']],['merah, biru, merah, hijau, biru','warna',['saiz kasut','jenis buah','bilangan kaki']],['bola, badminton, bola, renang','jenis sukan',['warna kegemaran','umur murid','nama kelas']],['Isnin, Rabu, Isnin, Jumaat','hari',['jenis buah','warna','tinggi murid']]]);
  return{kind:'pick',...opts(V[2],V[1]),q:'Data “'+V[0]+'” boleh dikelaskan berdasarkan…',s:'Lihat apakah persamaan semua item dalam data itu.',a:''}}}),
 reasonCollect:(arch)=>({arch,f:C=>{const V=pick([['buah kegemaran kelas','pilihan buah setiap murid',['tinggi setiap murid','warna kasut murid']],['sukan kegemaran murid','sukan pilihan setiap murid',['berat beg murid','nama ibu bapa murid']],['warna kegemaran kelas','warna pilihan setiap murid',['bilangan adik-beradik','umur guru']],['kuih paling laris di kantin','bilangan setiap kuih yang dijual',['harga buku','bilangan meja kantin']]]);
  return{kind:'pick',...opts(V[2],V[1]),q:'Untuk mengetahui '+V[0]+', data paling sesuai dikumpul ialah…',s:'Data mesti menjawab soalan yang ditanya.',a:''}}}),
 tallyCompare:(arch,set,lo,hi)=>({arch,f:C=>{const c=cats(set,3),v=vals(3,lo,hi),[i,j]=shuffle([0,1,2]).slice(0,2),big=v[i]>v[j]?i:j;return{wk:{lines:[rdT(c[i][0],v[i],i),rdT(c[j][0],v[j],j)],finSay:'Jadi yang manakah lebih banyak?'},kind:'pick',vis:{t:'tally',rows:c.map((x,k)=>[x[0],x[1],v[k]])},opts:[{id:'a',label:c[i][0]},{id:'b',label:c[j][0]}],correct:big===i?'a':'b',ansTxt:c[big][0],
  q:'Yang manakah lebih banyak: '+c[i][0]+' atau '+c[j][0]+'?',s:'Kira gundalan kedua-dua baris, kemudian banding.',a:c[i][0]+' = '+v[i]+', '+c[j][0]+' = '+v[j]+'.'}}}),
 tallyTotal:(arch,set,lo,hi)=>({arch,f:C=>{const c=cats(set,3),v=vals(3,lo,hi),[i,j]=shuffle([0,1,2]).slice(0,2);return{wk:{lines:[rdT(c[i][0],v[i],i),rdT(c[j][0],v[j],j),addL([v[i],v[j]])],value:v[i]+v[j]},kind:'pad',vis:{t:'tally',rows:c.map((x,k)=>[x[0],x[1],v[k]])},form:NUM(v[i]+v[j]),
  q:'Berapakah jumlah '+c[i][0]+' dan '+c[j][0]+'?',s:'Kira gundalan setiap baris, kemudian tambah.',a:v[i]+' + '+v[j]+' = '+(v[i]+v[j])}}}),
 tallyDiff:(arch,set,lo,hi)=>({arch,f:C=>{const c=cats(set,3),v=vals(3,lo,hi),[i,j]=shuffle([0,1,2]).slice(0,2),b=Math.max(v[i],v[j]),s=Math.min(v[i],v[j]);return{wk:{lines:[rdT(c[i][0],v[i],i),rdT(c[j][0],v[j],j),subL(b,s)],value:b-s},kind:'pad',vis:{t:'tally',rows:c.map((x,k)=>[x[0],x[1],v[k]])},form:NUM(b-s),
  q:'Berapakah beza bilangan '+c[i][0]+' dan '+c[j][0]+'?',s:'Beza = nombor besar tolak nombor kecil.',a:b+' − '+s+' = '+(b-s)}}}),
 tallyPick:(arch)=>({arch,f:C=>{const c=cats('guli',3),v=vals(3,3,9),i=R(0,2),items=shuffle(c.flatMap((x,j)=>range(v[j]).map(()=>x[1])));const o=opts([v[i]-1,v[i]+1,v[i]+2,v[i]-2].filter(x=>x>0).map(n=>'T:'+n),'T:'+v[i]);
  return{kind:'pick',vis:{t:'raw',items},...o,ansTxt:v[i]+' gundalan',q:'Tanda gundal manakah betul untuk guli '+c[i][0]+'?',sub:'Ketik guli untuk tanda ✓ semasa mengira.',s:'Kira guli '+c[i][0].toLowerCase()+' sahaja. Ingat ||||/ = 5.',a:''}}}),
 tableStmt:(arch)=>({arch,f:C=>{const c=cats('guli',3),v=vals(3,3,8),items=shuffle(c.flatMap((x,j)=>range(v[j]).map(()=>x[1]))),mx=argmax(v),mn=argmin(v),md=3-mx-mn;
  const good='Guli '+c[mx][0]+' paling banyak',bad=['Guli '+c[mn][0]+' paling banyak','Guli '+c[md][0]+' paling sedikit','Jumlah semua guli ialah '+(sum(v)+2)];
  return{kind:'pick',vis:{t:'raw',items},...opts(bad,good),q:'Susun data dalam jadual dahulu. Pernyataan manakah betul?',sub:'Ketik guli untuk tanda ✓ semasa mengira.',s:'Kira setiap warna dahulu, kemudian semak setiap pernyataan.',a:'Jumlah = '+v.join(' + ')+' = '+sum(v)}}}),

 /* ---------- piktograf ---------- */
 pictRead:(arch,set,key,lo,hi)=>({arch,f:C=>{const c=cats(set,4),n=vals(4,lo,hi),k=pick([].concat(key)),i=R(0,3),sym=k===1?null:'★';return{wk:{lines:pictL(c[i][0],n[i],i,k),value:n[i]*k},kind:'pad',vis:{t:'pict',rows:c.map((x,j)=>[x[0],x[1],n[j]]),key:k,sym},form:NUM(n[i]*k),
  q:'Berapakah bilangan '+c[i][0]+'?',s:k===1?'Satu gambar = 1. Kira gambar dalam baris '+c[i][0]+'.':'Satu ★ mewakili '+k+'. Darab bilangan ★ dengan '+k+'.',a:k===1?'Kira gambar '+c[i][0]+'.':n[i]+' × '+k+' = '+n[i]*k}}}),

 if(!m)return{grade:3,modes:GRADES[3].modes,start:{}};const gr=+m[1],start={},want=[];
 m[2].split('-').filter(Boolean).forEach(t=>{const[k,n]=t.split('@');if(GEN[gr][k]&&!want.includes(k)){want.push(k);if(n)start[k]=+n}});

function pieSVG(sec,mark){const T=sum(sec.map(s=>s[1]));let a0=-Math.PI/2,h='';const r=46,c=50;
 sec.forEach((s,i)=>{const a1=a0+s[1]/T*Math.PI*2,lg=a1-a0>Math.PI?1:0,x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1),m=(a0+a1)/2;
  h+=sec.length===1?'<circle cx="50" cy="50" r="46" fill="'+PIE[i]+'"/>':'<path d="M50 50L'+x0.toFixed(2)+' '+y0.toFixed(2)+'A46 46 0 '+lg+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'z" fill="'+PIE[i%5]+'" stroke="#3b2c52" stroke-width="1.5"'+(mark===i?' class="mk"':'')+'/>';
  const tx=s[3]!=null?s[3]:s[0].length<=2?s[0]:'';if(tx)h+='<text x="'+(c+r*.6*Math.cos(m)).toFixed(1)+'" y="'+(c+r*.6*Math.sin(m)+4).toFixed(1)+'">'+tx+'</text>';a0=a1});
 return '<svg class="pie" viewBox="0 0 100 100">'+h+'<circle cx="50" cy="50" r="46" fill="none" stroke="#3b2c52" stroke-width="2"/></svg>'}
function pieIx(secs,sel){let a0=-90,h='';const P=(d)=>[50+46*Math.cos(d*Math.PI/180),50+46*Math.sin(d*Math.PI/180)];
 secs.forEach((s,i)=>{const a1=a0+s.a,[x0,y0]=P(a0),[x1,y1]=P(a1),m=(a0+a1)/2,lg=s.a>180?1:0,[tx,ty]=[50+28*Math.cos(m*Math.PI/180),50+28*Math.sin(m*Math.PI/180)];
  h+=(s.a>=360?'<circle cx="50" cy="50" r="46"':'<path d="M50 50L'+x0.toFixed(2)+' '+y0.toFixed(2)+'A46 46 0 '+lg+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'z"')+' fill="'+s.fill+'" stroke="#3b2c52" stroke-width="'+(sel===i?3.5:1.5)+'"'+(s.id!=null?' data-s="'+s.id+'" class="sx'+(sel===i?' on':'')+'"':'')+'/>';
  (s.t||[]).forEach((t,k)=>h+='<text x="'+tx.toFixed(1)+'" y="'+(ty+3+(k-(s.t.length-1)/2)*10).toFixed(1)+'"'+(k?' class="sm"':'')+'>'+t+'</text>');a0=a1});
 return '<svg class="pie ix" viewBox="0 0 100 100">'+h+'<circle cx="50" cy="50" r="46" fill="none" stroke="#3b2c52" stroke-width="2" pointer-events="none"/></svg>'}
function spinSVG(segs){const n=segs.length,C={Merah:'#ff5a6e',Biru:'#4f8dff',Kuning:'#ffd23f',Hijau:'#48c06a'};return pieIx(segs.map(c=>({a:360/n,fill:C[c]}))).replace('class="pie ix"','class="pie spin"').replace('</svg>','<path d="M50 50L50 12" stroke="#2a1a0e" stroke-width="3.5" stroke-linecap="round"/><path d="M50 6l-5 9h10z" fill="#2a1a0e"/><circle cx="50" cy="50" r="5" fill="#2a1a0e"/></svg>')}
function bagSVG(m){const L=[];Object.entries(m).forEach(([k,n])=>{for(let i=0;i<n;i++)L.push(k)});const cols=L.length>12?5:4,rows=Math.ceil(L.length/cols),s=L.length>12?11:13;
 const W=cols*s+16,H=rows*s+22;let h='<svg class="bagi" viewBox="0 0 '+W+' '+H+'"><path d="M4 12Q'+W/2+' 4 '+(W-4)+' 12L'+(W-2)+' '+(H-6)+'Q'+W/2+' '+(H+2)+' 2 '+(H-6)+'z" fill="#c98b57" stroke="#5e3519" stroke-width="2"/><path d="M'+(W/2-10)+' 8q10-8 20 0" stroke="#5e3519" stroke-width="2.5" fill="none"/>';
 shuffle(L).forEach((k,i)=>{const x=8+(i%cols)*s+s/2,y=16+Math.floor(i/cols)*s+s/2,c=GCOL[k];h+='<circle cx="'+x+'" cy="'+y+'" r="'+(s/2-1)+'" fill="'+c[0]+'" stroke="'+c[1]+'" stroke-width="1.2"/>'});

function chartHTML(rows,step,top,build){const N=top/step;let y='';for(let i=0;i<=N;i++)y+='<i style="bottom:'+(i/N*100)+'%">'+i*step+'</i>';
 const cols=rows.map((r,j)=>build?'<div class="col" data-c="'+j+'">'+range(N).map(i=>'<button type="button" class="cell" data-c="'+j+'" data-i="'+i+'" aria-label="'+r+' sampai '+(i+1)*step+'"></button>').join('')+'</div>':'<div class="col" data-r="'+j+'"><span class="bar" style="height:'+(r[1]/top*100)+'%;background:'+BARC[j%5]+'"></span></div>').join('');

let devGrade=cfg.grade,devModes=[...cfg.modes];
function drawDev(){$('devGrades').innerHTML=[1,2,3,4,5,6].map(x=>'<button type="button" data-g="'+x+'" class="'+(x===devGrade?'on':'')+'">D'+x+'</button>').join('');
 $('devTitle').textContent='Darjah '+devGrade+' · '+GRADES[devGrade].title;
 $('devModes').innerHTML=GRADES[devGrade].modes.map(k=>'<button type="button" data-k="'+k+'" class="'+(devModes.includes(k)?'on':'')+'">'+MODE_LABEL[k].toLowerCase()+'</button>').join('');
 $('devGrades').querySelectorAll('button').forEach(b=>b.onclick=()=>{devGrade=+b.dataset.g;devModes=[...GRADES[devGrade].modes];drawDev()});
 $('devModes').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;devModes=devModes.includes(k)?devModes.filter(x=>x!==k):[...devModes,k];if(!devModes.length)devModes=[k];drawDev()});
 $('devHash').textContent='#d'+devGrade+'-'+devModes.join('-')}
function applyDev(hash){const h=hash?hash.replace('#',''):'d'+devGrade+'-'+devModes.join('-');try{history.replaceState(null,'','#'+h)}catch(e){}cfg=parseHash(h);$('dev').hidden=true;$('complete').hidden=true;resetAll();startRound()}
const SIMS={
 'D1 lemah gundalan':{skill:'D1.DATA',rows:[['y1v2_8_1_1_complete_tally','unresolved'],['y1v2_8_1_1_count_tally','assisted'],['y1v2_8_2_1_read_one','independent']]},
 'D4 lemah petunjuk piktograf':{skill:'D4.DATA',rows:[['pictograph_key','unresolved'],['pictograph_claim','assisted'],['read_bar','independent']]},
 'D5 lemah median':{skill:'D5.DATA',rows:[['y5_median_even','unresolved'],['y5_median','assisted'],['y5_mode','independent']]},
 'D6 lemah kebolehjadian':{skill:'D6.DATA',rows:[['y6v2_8_2_2_compare_different_totals','unresolved'],['y6v2_8_2_2_claim','assisted'],['y6v2_8_2_1_certain','independent']]}};
$('sims').innerHTML=Object.keys(SIMS).map(k=>'<button type="button" data-sim="'+k+'">'+k+'</button>').join('');
function runSim(k){const s=SIMS[k],Rt=window.PAPosPeninjau;if(!Rt){$('simOut').textContent='Router tidak dimuatkan.';return}
 const plan=Rt.planFor({learnerReviewV1:{encounters:s.rows.map(([a,o],i)=>({skillId:s.skill,archetypeId:a,outcome:o,mode:'practice',questionKey:'q'+i}))}},s.skill);
 if(!plan){$('simOut').innerHTML='<b>'+s.skill+'</b> → tiada mod yang sesuai.';$('simGo').hidden=true;return}
 $('simOut').innerHTML='<b>'+s.skill+'</b> → '+plan.start.map(m=>MODE_LABEL[m.mode].toLowerCase()+' (T'+(m.start+1)+')').join(', ')+' · #'+plan.hash;$('simGo').hidden=false;$('simGo').onclick=()=>applyDev('#'+plan.hash)}
/* DEV: jump straight to a round of one worked-example kind and offer "Jom tengok cara" at once. */
const WK_TRY=[
 ['Baca gundalan','d1-gundal',c=>c.arch==='y1v2_8_1_1_count_tally'&&c.kind==='pad'&&!/jumlah/i.test(c.q)],
 ['Jumlah gundalan','d2-gundal',c=>c.arch==='progress_data_total'],
 ['Banding gundalan','d2-gundal',c=>c.kind==='pick'&&c.vis?.t==='tally'],
 ['Baca piktograf','d1-piktograf',c=>c.arch==='y1v2_8_2_1_read_one'&&c.kind==='pad'],
 ['Piktograf ★','d4-piktograf',c=>c.arch==='pictograph_read'],
 ['Petunjuk ★','d4-piktograf',c=>c.arch==='pictograph_key'],
 ['Baca carta palang','d2-carta',c=>c.arch==='integrity_bar_read'],
 ['Beza palang','d2-masalah',c=>c.arch==='integrity_data_difference'],
 ['Sasaran jualan','d3-carta',c=>c.q.startsWith('Sasaran')],
 ['Wang jualan','d4-carta',c=>c.form?.fields[0]?.pre==='RM'],
 ['Min','d5-purata',c=>c.arch==='y5_mean'&&c.kind==='pad'],
 ['Median','d5-purata',c=>c.arch==='y5_median'],
 ['Julat','d5-purata',c=>c.arch==='y5_range'],
 ['Mod (jadual)','d5-purata',c=>c.arch==='y5_mode'&&c.vis?.t==='table'],
 ['Peratus carta pai','d5-pai',c=>c.arch==='y5_pie_quantity'],
 ['Carta pai (sudut)','d6-pai',c=>c.arch==='y6v2_8_1_1_read_quantity'],
 ['Sudut sektor','d6-pai',c=>c.arch==='y6v2_8_1_1_reverse_sector'&&c.kind==='pad']];
function drawWkTry(){const box=$('wkTry');if(!box)return;box.innerHTML=WK_TRY.map((k,i)=>'<button type="button" data-i="'+i+'">'+k[0]+'</button>').join('');
 box.querySelectorAll('button').forEach(b=>b.onclick=()=>tryWorked(WK_TRY[+b.dataset.i]))}
function tryWorked([label,hash,test]){
 try{history.replaceState(null,'','#'+hash)}catch(e){}cfg=parseHash(hash);resetAll();
 let found=null;
 for(let i=0;i<3000&&!found;i++){const k=cfg.modes[i%cfg.modes.length],n=GEN[cfg.grade][k].length;served=i%cfg.modes.length;tier[k]=Math.floor(i/cfg.modes.length)%n;clean[k]=0;
  const c=makeQ(),keep=q;q=c;let ok=false;try{ok=!!workedPlan()&&test(c)}catch(_){}q=keep;if(ok)found=c}
 $('dev').hidden=true;$('complete').hidden=true;served=0;
 if(!found){msg('DEV: tiada soalan "'+label+'" dijumpai.','bad',3000);return}
 forcedQ=found;startRound();misses=3;offerWorked();setTimeout(()=>msg('DEV · '+label+': tekan “Jom tengok cara”.','',3500),800)}
$('devBtn').onclick=()=>{if(!DEV_ENABLED)return;devGrade=cfg.grade;devModes=[...cfg.modes];drawDev();drawWkTry();$('simOut').textContent='Pilih satu senario.';$('simGo').hidden=true;$('dev').hidden=false};
$('devClose').onclick=()=>{$('dev').hidden=true};$('devApply').onclick=()=>applyDev();
document.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>runSim(b.dataset.sim));
window.addEventListener('hashchange',()=>{cfg=parseHash();resetAll();startRound()});
window.__posDebug=()=>q&&{ok:q.ok,names:q.names,pieA:q.pie&&q.pie.A,kind:q.kind,arch:q.arch,mode:q.mode,tier:q.tierIx,form:q.form,need:q.need,build:q.build,correct:q.correct,items:q.items,cnt,seq}; // ujian sahaja
window.__posGen={GEN,current:()=>q,planFor:x=>{const keep=q;q=x;try{return workedPlan()}finally{q=keep}},showNormal:(t,n=0)=>{tier[cfg.modes[n%cfg.modes.length]]=t;served=n;startRound();return q},setInp:a=>{inp=a}}; // ujian sahaja
function focusLaunchAllowed(){try{const p=new URLSearchParams(location.search),skill=p.get('skill'),host=window.parent,sk=window.PAPosPeninjau?.SKILL?.[skill];/* The app's db is a top-level let (not window.db), so ask the bridge whether this frame is the active Focus launch. */return host!==window&&p.get('pa_focus_live')==='1'&&!!p.get('pa_nonce')&&!!sk&&Number(sk[0])===cfg.grade&&host.PAFocusMiniGamesLive?.isActiveFrame?.(window,p.get('pa_nonce'),skill,'pos-peninjau')===true}catch(_){return false}}
if(!DEV_ENABLED&&!focusLaunchAllowed()){document.body.innerHTML='<main style="min-height:100dvh;display:grid;place-items:center;padding:24px;background:#29243f;color:#fff6e0;font:700 16px system-ui;text-align:center"><section><h1>Pos Peninjau</h1><p>Buka latihan ini melalui Kemahiran Fokus untuk profil murid.</p></section></main>';return}
resetAll();startRound();
if(!DEV_ENABLED){$('devBtn').hidden=true;$('devBtn').style.display='none';$('dev').hidden=true;$('dev').style.display='none'}
})();
</script>
