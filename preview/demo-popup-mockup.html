<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mockup Popup · Pahlawan Angka</title><style>
:root{--ink:#06164c;--blue:#0067d9;--gold:#ffcb32;--cream:#fdfaf2}*{box-sizing:border-box}body{margin:0;background:#07182d url('../assets/landing-approved-v1/fantasy-background.webp') center/cover fixed;font:14px/1.55 system-ui,sans-serif;color:var(--ink)}body:before{pointer-events:none;content:'';position:fixed;inset:0;background:#03152dbf;backdrop-filter:blur(5px)}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #0067d9;outline-offset:3px}.review{position:relative;max-width:540px;margin:auto;padding:18px 16px 0}.review-head{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#d9e6f2;font-size:10px;font-weight:750;letter-spacing:.08em}.review-head a{color:#d9e6f2;text-decoration:none;font-size:11px;letter-spacing:0}.switch{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 18px}.switch button{border:1px solid #496381;background:#142c48;color:#c9d9ec;border-radius:10px;font-size:11px;font-weight:750;min-height:40px;padding:8px 3px}.switch button[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}.popup{position:relative;width:min(508px,calc(100% - 28px));max-width:508px;margin:0 auto 24px;background:var(--cream);border:2px solid #e7c667;border-radius:24px;padding:23px;box-shadow:0 6px 0 #80632788,0 25px 70px #0005}.visual-head{display:flex;align-items:center;gap:16px;margin:0 0 20px}.prop{width:82px;height:90px;flex:0 0 82px;position:relative;display:grid;place-items:center;background:radial-gradient(ellipse,#d8edff 0,transparent 68%)}.prop svg{width:78px;height:84px;filter:drop-shadow(0 5px 0 #06164c18)}.eyebrow{color:#0067d9;font-weight:850;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.visual-head h1{font-size:26px;line-height:1.16;letter-spacing:-.035em;margin:6px 0 0}.steps{padding:0;margin:0;list-style:none;display:grid;gap:11px}.steps li{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid #e6ddc4;border-radius:13px;padding:12px 13px}.step-icon{width:24px;height:24px;flex:0 0 24px;border:1px solid #c6dcf3;border-radius:50%;background:#eef6ff;color:#0067d9;display:grid;place-items:center;font-size:12px;font-weight:850;margin-top:2px}.steps p{margin:0;color:#314866;font-size:14px;line-height:1.6}mark{background:#e5f0ff;color:#064591;border-radius:4px;padding:1px 3px;font-weight:800;box-decoration-break:clone;-webkit-box-decoration-break:clone}.note{margin:16px 0 18px;padding:12px 13px;border-left:3px solid #e9b737;border-radius:0 9px 9px 0;background:#fff2cd;color:#685323;font-size:12px;line-height:1.55}.action{display:flex;align-items:center;justify-content:space-between;gap:15px}.action>span{font-size:10px;color:#73829a}.primary{background:var(--gold);border:1px solid #b38217;border-radius:12px;padding:11px 20px;box-shadow:0 3px 0 #b38217;color:var(--ink);font-size:14px;font-weight:850;min-height:44px}.primary:hover{background:#ffda65}.replay{position:relative;z-index:1;background:none;border:0;color:#cbdcef;font-size:11px;display:block;margin:0 auto 20px;text-decoration:underline;text-underline-offset:3px}.pop-in .prop svg{animation:prop-in .6s cubic-bezier(.2,.8,.2,1) both}.pop-in .step-icon{animation:stamp .35s ease-out both}.pop-in li:nth-child(2) .step-icon{animation-delay:.12s}.pop-in li:nth-child(3) .step-icon{animation-delay:.24s}@keyframes stamp{from{transform:scale(.8);background:#fff}to{transform:scale(1);background:#eef6ff}}@keyframes prop-in{from{transform:translateY(7px) scale(.96)}to{transform:translateY(0) scale(1)}}[data-tone=gold] .prop{background:radial-gradient(ellipse,#ffedb2 0,transparent 68%)}.review-note{text-align:center;position:relative;color:#bfccdc;font-size:10px;margin:0 16px 20px}@media(max-width:380px){.review{padding:12px 12px 0}.popup{margin-left:auto;margin-right:auto;padding:17px;border-radius:20px}.visual-head{gap:10px;margin-bottom:15px}.prop{width:64px;height:76px;flex-basis:64px}.prop svg{width:64px;height:72px}.visual-head h1{font-size:23px}.steps li{padding:10px;gap:9px}.steps p{font-size:13px}.note{font-size:11px;margin:13px 0 16px}.switch{margin-bottom:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="review"><div class="review-head"><span>MOCKUP · POPUP DEMO</span><a href="demo-pilih-darjah-mockup.html?pose=5fc5f8a">← Pilih darjah</a></div><nav class="switch" aria-label="Bandingkan popup"><button data-popup="0" aria-pressed="true">Autopilot</button><button data-popup="1" aria-pressed="false">Mini-game</button><button data-popup="2" aria-pressed="false">Cikgu Dimensi</button></nav></div><main class="popup" id="popup" aria-labelledby="title"></main><button class="replay" id="replay">Ulang animasi</button><p class="review-note">Pratonton sahaja · Untuk semak ayat dan gaya popup.</p><script>
const items=[{"id": "autopilot", "label": "Autopilot", "step": "01 · Kesan", "title": "Salah kat mana?", "icon": "<svg viewBox=\"0 0 100 105\" aria-hidden=\"true\"><g stroke=\"#06164c\" stroke-width=\"2.8\" stroke-linejoin=\"round\"><path d=\"m49 7 28 20-10 43-21 20-23-24 1-40Z\" fill=\"#0067d9\"/><path d=\"m49 7-3 37 31-17Z\" fill=\"#b7e5ff\"/><path d=\"m24 26 22 18 3-37Z\" fill=\"#62b9f4\"/><path d=\"m46 44 21 26-21 20Z\" fill=\"#003673\"/><path d=\"m46 44-23 22 23 24Z\" fill=\"#168ee0\"/><path d=\"m86 8 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z\" fill=\"#ffcb32\"/></g></svg>", "points": ["App tengok <mark>corak jawapan</mark>, bukan kira betul atau salah saja.", "Bila kesilapan berulang, app beri <mark>soalan sejenis</mark> untuk semak bahagian yang anak belum faham.", "Lepas tu, <mark>mini-game dan latihan</mark> boleh fokus pada kemahiran itu."], "note": "Dalam demo ni, beberapa jawapan <b>sengaja disalahkan</b>. Ini contoh saja, bukan keputusan anak anda.", "cta": "Tengok contoh", "tone": "blue"}, {"id": "mini", "label": "Mini-game", "step": "02 · Bantu", "title": "Yang susah tadi, kita cuba cara lain.", "icon": "<svg viewBox=\"0 0 100 105\" aria-hidden=\"true\"><g stroke=\"#06164c\" stroke-width=\"2.8\" stroke-linejoin=\"round\"><path d=\"M35 13h30v12l-5 7v12l20 29q7 16-10 20H30q-17-4-10-20l20-29V32l-5-7Z\" fill=\"#e7f5ff\"/><path d=\"m25 67 10-12q18 13 34 0l10 18q6 15-9 17H30q-15-2-9-17Z\" fill=\"#0067d9\"/><path d=\"M35 13h30v12H35Z\" fill=\"#bc8540\"/><path d=\"M31 27h38v9H31Z\" fill=\"#ffcb32\"/><path d=\"M32 70q7-4 13-2\" fill=\"none\" stroke=\"#fff\"/><path d=\"m55 54 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z\" fill=\"#ffcb32\"/></g></svg>", "points": ["Contoh tadi banyak tersalah <mark>pecahan</mark>.", "Mini-game ini beri <mark>latihan pecahan</mark>, dalam bentuk permainan.", "Cuba <mark>3 soalan sendiri</mark>. Lepas tu, tengok <mark>2 contoh bantuan Wira</mark> — satu langkah pada satu masa."], "note": "Tekan <b>Seterusnya</b> bila dah bersedia. Ikut rentak sendiri.", "cta": "Jom cuba", "tone": "gold"}, {"id": "coach", "label": "Cikgu Dimensi", "step": "03 · Semak lagi", "title": "Cikgu semak lagi.", "icon": "<svg viewBox=\"0 0 100 105\" aria-hidden=\"true\"><g stroke=\"#06164c\" stroke-width=\"2.8\" stroke-linejoin=\"round\"><path d=\"M17 27 52 10 84 26v58L49 96 17 80Z\" fill=\"#003673\"/><path d=\"m17 21 35-16 32 16v57L49 91 17 74Z\" fill=\"#0067d9\"/><path d=\"m25 27 27-12 23 11v44L49 80 25 68Z\" fill=\"#fff5d6\"/><path d=\"m47 19 6-3v63l-6 2Z\" fill=\"#ffcb32\"/><path d=\"m57 29 11-4m-11 15 11-4m-32 4 6 3m-6 8 6 3\" fill=\"none\"/><path d=\"m74 4 2 6 6 2-6 2-2 6-2-6-6-2 6-2Z\" fill=\"#ffcb32\"/></g></svg>", "points": ["Anak dapat <mark>soalan campuran</mark>, ikut tahap kefahaman.", "Yang masih susah, Cikgu <mark>semak lagi</mark>. Dalam contoh ni: pecahan.", "Jawapan baru bantu Cikgu <mark>pilih latihan seterusnya</mark>."], "note": "Cuba <b>6 soalan</b>. Lepas tu, tengok contoh ringkasan untuk ibu bapa dalam Otak Pahlawan.", "cta": "Mula latihan", "tone": "blue"}];let active=0;const box=document.querySelector('#popup');function paint(n){active=n;const s=items[n];box.classList.remove('pop-in');box.dataset.tone=s.tone;box.innerHTML=`<div class="visual-head"><div class="prop">${s.icon}</div><div><span class="eyebrow">${s.step}</span><h1 id="title">${s.title}</h1></div></div><ol class="steps">${s.points.map((p,i)=>`<li><span class="step-icon" aria-hidden="true">${i+1}</span><p>${p}</p></li>`).join('')}</ol><div class="note">${s.note}</div><div class="action"><span>Contoh demo</span><button class="primary" id="next">${s.cta} <span aria-hidden="true">›</span></button></div>`;document.querySelectorAll('[data-popup]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.popup)===n)));void box.offsetWidth;box.classList.add('pop-in');document.querySelector('#next').onclick=()=>paint((active+1)%items.length)}document.querySelectorAll('[data-popup]').forEach(b=>b.onclick=()=>paint(Number(b.dataset.popup)));document.querySelector('#replay').onclick=()=>paint(active);paint(0);
</script></body></html>
