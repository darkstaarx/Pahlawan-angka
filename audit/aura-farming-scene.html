<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit — Aura Farming → Finisher</title>
<style>
:root{color-scheme:dark;--scale:1;--glow:.82}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07101e;font-family:system-ui,sans-serif;color:#eef7ff}body{display:grid;place-items:center;padding:20px}.audit{width:min(100%,980px)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border:1px solid #2b557c;border-radius:14px;background:#0c1c31;box-shadow:0 10px 26px #0006}.toolbar strong{margin-right:auto;color:#8bdcff;letter-spacing:.08em;text-transform:uppercase;font-size:12px}button{border:1px solid #5abaff;border-radius:9px;background:#173b62;color:#fff;padding:8px 12px;font-weight:800;cursor:pointer}button:hover{background:#225889}label{font-size:12px;color:#b7d8ed}input{accent-color:#5fd6ff;vertical-align:middle}
.stage{position:relative;overflow:hidden;isolation:isolate;aspect-ratio:16/9;border:2px solid #152d48;border-radius:18px;background:#000 url('../../assets/battlefields/nusantara-temple/arena-v1.webp') center/cover no-repeat;box-shadow:0 22px 50px #000b}.stage:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#06111d22,#0008);pointer-events:none}.aura{position:absolute;left:17%;bottom:4%;width:30%;aspect-ratio:3/4;z-index:2;overflow:hidden;opacity:calc(var(--glow) * .55);mix-blend-mode:screen;filter:saturate(1.08) brightness(1.02) drop-shadow(0 0 15px #4ad6ff99);transform:scale(var(--scale));transform-origin:50% 75%}.aura .sheet{width:100%;height:100%;background:url('aura-farming-assets/icy-math-aura-sheet-v3.png') 0 0/400% 100% no-repeat;animation:auraSheet 2.4s linear 1 forwards}.hero-sprite{position:absolute;left:18%;bottom:4%;width:28%;aspect-ratio:3/4;z-index:4;overflow:hidden;filter:drop-shadow(0 13px 7px #03111dcc);animation:heroBreath 2.4s ease-in-out 1 forwards}.hero-sprite .sheet{width:100%;height:100%;background:url('aura-farming-assets/wira-charge-sheet-v3.png') 0 0/400% 100% no-repeat;animation:heroSheet 2.4s linear 1 forwards}
.eye-cutscene{position:absolute;inset:0;z-index:10;opacity:0;pointer-events:none;background:#07101e url('aura-farming-assets/wira-eye-cutin-v1.png') 0 0/400% 100% no-repeat;animation:none}.seal-target{position:absolute;z-index:6;left:76%;top:22%;width:25%;aspect-ratio:1;transform:translateX(-50%);opacity:0;filter:drop-shadow(0 0 18px #7feaff);background:url('../../assets/fx/segel/emas-v2.png') center/contain no-repeat}.glacier-strike{position:absolute;z-index:8;left:62%;bottom:0;width:28%;height:78%;overflow:hidden;opacity:0;filter:drop-shadow(0 0 20px #4bdcff)}.glacier-strike .sheet{width:100%;height:100%;background:url('aura-farming-assets/glacier-math-strike-v1.png') 0 0/400% 100% no-repeat;animation:none}
.stage.phase-eye .aura,.stage.phase-eye .hero-sprite,.stage.phase-fx .aura,.stage.phase-fx .hero-sprite,.stage.done .aura,.stage.done .hero-sprite{opacity:0;visibility:hidden}.stage.phase-eye .eye-cutscene{opacity:1}.stage.phase-fx .eye-cutscene{opacity:0;visibility:hidden}.stage.phase-fx .seal-target{opacity:.32;animation:sealPulse 1.2s ease-out 1 forwards}.stage.phase-fx .glacier-strike{opacity:1}.stage.done .seal-target{opacity:.8}.stage.done .glacier-strike{opacity:1}.readout{margin-top:10px;color:#a9cce1;font-size:12px;line-height:1.4}
@keyframes auraSheet{0%,24.99%{background-position:0 0}25%,49.99%{background-position:33.333% 0}50%,74.99%{background-position:66.666% 0}75%,100%{background-position:100% 0}}@keyframes heroSheet{0%,24.99%{background-position:0 0}25%,49.99%{background-position:33.333% 0}50%,74.99%{background-position:66.666% 0}75%,100%{background-position:100% 0}}@keyframes eyeSheet{0%,24.99%{background-position:0 0}25%,49.99%{background-position:33.333% 0}50%,74.99%{background-position:66.666% 0}75%,100%{background-position:100% 0}}@keyframes glacierSheet{0%,24.99%{background-position:0 0}25%,49.99%{background-position:33.333% 0}50%,74.99%{background-position:66.666% 0}75%,100%{background-position:100% 0}}@keyframes heroBreath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.012)}}@keyframes sealPulse{0%{transform:translateX(-50%) scale(.7);filter:drop-shadow(0 0 3px #7feaff)}70%{transform:translateX(-50%) scale(1.12);filter:drop-shadow(0 0 30px #7feaff)}100%{transform:translateX(-50%) scale(1);filter:drop-shadow(0 0 18px #7feaff)}}
</style></head>
<body><main class="audit"><div class="toolbar"><strong>Audit · Aura → Final Blow</strong><button id="toggle" type="button">Pause</button><button id="reset" type="button">Reset / Replay</button><label>Saiz <input id="scale" type="range" min=".82" max="1.14" step=".01" value="1"></label><label>Cahaya <input id="glow" type="range" min=".35" max="1" step=".01" value=".82"></label></div>
<section class="stage phase-farming" id="stage" aria-label="Aura farming, close-up mata, dan hentaman glacier"><div class="aura"><div class="sheet"></div></div><div class="hero-sprite" role="img" aria-label="Wira berdiri dengan mata tertutup dan mengangkat pedang ais elektrik"><div class="sheet"></div></div><div class="eye-cutscene" aria-hidden="true"></div><div class="seal-target" aria-hidden="true"></div><div class="glacier-strike" aria-hidden="true"><div class="sheet"></div></div></section>
<div class="readout" id="readout">Urutan automatik: 1 loop aura farming → cutscene mata Wira → icy-electric glacier menghentam segel. Tiada video digunakan.</div></main>
<script>
const root=document.documentElement,stage=document.querySelector('#stage'),toggle=document.querySelector('#toggle'),reset=document.querySelector('#reset'),scale=document.querySelector('#scale'),glow=document.querySelector('#glow'),readout=document.querySelector('#readout');const auraSheet=document.querySelector('.aura .sheet'),eye=document.querySelector('.eye-cutscene'),glacier=document.querySelector('.glacier-strike .sheet');let paused=false,phase='farming';
scale.addEventListener('input',()=>root.style.setProperty('--scale',scale.value));glow.addEventListener('input',()=>root.style.setProperty('--glow',glow.value));function playAll(){stage.querySelectorAll('*').forEach(e=>e.style.animationPlayState='running')}function pauseAll(){stage.querySelectorAll('*').forEach(e=>e.style.animationPlayState='paused')}
function startEye(){if(paused||phase!=='farming')return;phase='eye';stage.className='stage phase-eye';readout.textContent='Cutscene: kamera rapat pada mata Wira; kuasa icy-electric menyala pada cornea.';eye.style.animation='none';void eye.offsetWidth;eye.style.animation='eyeSheet 1.45s linear 1 forwards';playAll()}
function startGlacier(){if(paused||phase!=='eye')return;phase='fx';stage.className='stage phase-fx';readout.textContent='Final blow: glacier icy-electric terpancut dari bawah dan menghentam segel.';glacier.style.animation='none';void glacier.offsetWidth;glacier.style.animation='glacierSheet 1.2s linear 1 forwards';playAll()}
auraSheet.addEventListener('animationend',startEye);eye.addEventListener('animationend',startGlacier);glacier.addEventListener('animationend',()=>{if(!paused){phase='done';stage.className='stage done';readout.textContent='Selesai. Reset / Replay untuk uji urutan dari awal.'}});
toggle.addEventListener('click',()=>{paused=!paused;paused?pauseAll():playAll();toggle.textContent=paused?'Play':'Pause'});
reset.addEventListener('click',()=>{paused=false;phase='farming';scale.value='1';glow.value='.82';root.style.setProperty('--scale','1');root.style.setProperty('--glow','.82');stage.className='stage phase-farming';[auraSheet,eye,glacier].forEach(e=>{e.style.animation='none';void e.offsetWidth});auraSheet.style.animation='auraSheet 2.4s linear 1 forwards';document.querySelector('.hero-sprite .sheet').style.animation='heroSheet 2.4s linear 1 forwards';document.querySelector('.hero-sprite').style.animation='heroBreath 2.4s ease-in-out 1 forwards';toggle.textContent='Pause';readout.textContent='Urutan automatik: 1 loop aura farming → cutscene mata Wira → icy-electric glacier menghentam segel. Tiada video digunakan.';playAll()});
</script></body></html>
