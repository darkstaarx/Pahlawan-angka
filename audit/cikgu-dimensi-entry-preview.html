<script>var db={name:'Pratonton',schoolGrade:1,demoMode:true},sess={demoMode:true},paMuted=true;function pageLockParentPin(){return '1234'}function save(){};</script><script src="js/rapid-lock-v1.js?v=restu-companions-v1"></script>
<script>
(function(){
  'use strict';
  const statusEl=document.getElementById('status'),replay=document.getElementById('replay'),companionSelect=document.getElementById('companion'),rescueSelect=document.getElementById('rescue'),holdLanding=document.getElementById('holdLanding'),viewportSelect=document.getElementById('viewport');
  const defaultCompanion='ketupatKura',defaultRescue='durianKerbau';
  let sceneReady=false,runToken=0;
  const byId=id=>PetCollection.catalog[id];
  const profile=()=>{const data={name:'Pratonton',schoolGrade:1,level:60,demoMode:true,petCollectionMigrationVersion:2,petProgressionVersion:4,rewards:{pets:{},equippedPet:defaultCompanion},petCollection:{},expedition:{activePetId:defaultCompanion},gembok:{completions:{}},completedMissions:{},petRescueAccess:{},petRescueRotation:{},petRescueSchedule:{}};Object.keys(PetCollection.catalog).forEach(id=>{data.petCollection[id]={state:'tamed',bondXp:500,appearance:id===defaultCompanion?'base':'bara',rescues:1}});PetCollection.ensure(data);return data;};
  function configFrom(data,id){const pet=id?PetCollection.snapshot(data).pets.find(item=>item.id===id):null;if(!pet)return null;return {id:pet.id,name:pet.name,sad:pet.assets?.sadFrames||(pet.assets?.sad?[pet.assets.sad]:[]),happy:pet.assets?.happy?[pet.assets.happy]:[],idle:pet.assets?.idle?[pet.assets.idle]:[],sadSheet:pet.assets?.sadSprite||null,evolutionTheme:pet.evolutionTheme||null,companionScale:pet.companionScale||.58,idleSheet:pet.assets?.idleSprite||null,happySheet:pet.assets?.happySprite||null};}
  function optionLabel(id,form){const meta=byId(id);return `${meta.name} · ${form==='bara'?'Bara':'Asas'}`;}
  function addOptions(){companionSelect.append(new Option('Tiada teman',''));rescueSelect.append(new Option('Aurora (lalai)',''));Object.keys(PetCollection.catalog).forEach(id=>{companionSelect.append(new Option(optionLabel(id,'base'),`${id}:base`));companionSelect.append(new Option(optionLabel(id,'bara'),`${id}:bara`));rescueSelect.append(new Option(optionLabel(id,'base'),`${id}:base`));rescueSelect.append(new Option(optionLabel(id,'bara'),`${id}:bara`));});companionSelect.value=`${defaultCompanion}:base`;rescueSelect.value=`${defaultRescue}:base`;}
  function choiceProfile(select,kind){const [id,form]=String(select.value||':').split(':');const data=profile();if(!id)return {data,config:null};data.petCollection[id].appearance=form==='bara'?'bara':'base';if(kind==='companion'){data.expedition.activePetId=id;data.rewards.equippedPet=id;}return {data,config:configFrom(data,id)};}
  function setControls(disabled){[replay,companionSelect,rescueSelect,holdLanding,viewportSelect].forEach(el=>el.disabled=disabled);}
  function setViewport(){const mobile=viewportSelect.value==='mobile';document.body.classList.toggle('preview-mobile',mobile);document.documentElement.style.setProperty('--preview-width',mobile?'390px':'100vw');document.documentElement.style.setProperty('--preview-height',mobile?'844px':'100vh');window.dispatchEvent(new Event('resize'));}
  async function playScene(){const token=++runToken;setControls(true);statusEl.textContent='Memuatkan teman dan sinematik…';PARapidLock.cancel();try{const activeChoice=choiceProfile(companionSelect,'companion');const rescueChoice=choiceProfile(rescueSelect,'rescue');db=activeChoice.data;const stage=await PASegelDemo.previewRestu();if(token!==runToken)return;stage.pause?.();await stage.setCompanion?.(activeChoice.config);await stage.setRescuePet?.(rescueChoice.config);stage.resume?.();if(holdLanding.checked){await stage.previewRestuFrame?.(1800);statusEl.textContent='Mendarat · ditahan untuk semakan (PIN tidak dipaparkan)';}else{statusEl.textContent='Wajah dekat → arena → mendarat 1.5 saat → Portal Restu';PARapidLock.lock([],()=>{statusEl.textContent='Selesai · boleh ulang semula';});}}catch(e){statusEl.textContent='Arena tidak dapat dimuat: '+(e?.message||e);}finally{if(token===runToken){setControls(false);replay.disabled=false;}}}
  companionSelect.addEventListener('change',()=>{if(sceneReady)playScene();});rescueSelect.addEventListener('change',()=>{if(sceneReady)playScene();});holdLanding.addEventListener('change',()=>{if(sceneReady)playScene();});viewportSelect.addEventListener('change',setViewport);replay.addEventListener('click',playScene);
  (async()=>{try{const petScript=document.createElement('script');petScript.src='js/pet-collection-system.js?v=restu-companions-v1';await new Promise((resolve,reject)=>{petScript.onload=resolve;petScript.onerror=reject;document.head.append(petScript);});addOptions();const r=await fetch('index.html',{cache:'no-store'});if(!r.ok)throw Error('HTML arena tidak tersedia');const doc=new DOMParser().parseFromString(await r.text(),'text/html');const arena=doc.getElementById('segelDemo');if(!arena)throw Error('Arena tidak ditemui');arena.classList.add('on');document.getElementById('mount').append(arena);const script=document.createElement('script');script.src='js/segel-demo-v2.1.0.js?v=restu-companions-v1';script.onload=()=>{sceneReady=true;playScene();};script.onerror=()=>statusEl.textContent='Pentas tidak dapat dimuat';document.head.append(script);}catch(e){statusEl.textContent=e?.message||'Pratonton tidak dapat dimuat';}})();
})();
</script></body></html>
