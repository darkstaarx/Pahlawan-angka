<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Watak rasmi · Pahlawan Angka</title><link rel="stylesheet" href="css/combat-motion-v1.css"><style>
*{box-sizing:border-box}body{margin:0;background:#091626;color:#f3f7ff;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:30px 18px}h1{font-size:28px;margin:0}p{color:#b8cadc;line-height:1.6}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #3e5975;border-radius:10px;background:#152b42;color:white;padding:12px 20px;font:600 15px system-ui;cursor:pointer}button[aria-pressed=true],#play{background:#f1c96b;color:#142335;border-color:#f1c96b}button:disabled{opacity:.45}#battleArena{height:340px;position:relative;border:1px solid #31526b;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 90%,#24576a 0,transparent 70%),#122438}#battleArena:after{content:"";position:absolute;left:4%;right:4%;bottom:35px;height:1px;background:#80d6dc44}.unit{position:absolute;bottom:35px;height:230px;width:28%}#hero{left:7%}#enemy{right:7%}#heroVisual,.enemySpriteWrap{height:100%;width:100%}.unit img{width:100%;height:100%;object-fit:contain;object-position:center bottom}.hidden{display:none}#status{align-self:center;color:#bdcede}.note{font-size:13px}@media(max-width:600px){main{padding:24px 12px}#battleArena{height:280px}.unit{height:180px;width:34%}#hero{left:3%}#enemy{right:3%}}
</style></head><body data-screen="game"><main><h1>Satu versi rasmi setiap watak</h1><p>Wira, Bunga dan Sidma menggunakan reka bentuk pilihan. Serangan biasa mengekalkan rupa watak yang sama.</p><div class="controls" id="choices"></div><div id="game"><div id="battleArena"><div id="hero" class="unit"><div id="heroVisual"><img id="heroIdle" src="assets/heroes/wira/idle.webp" alt="Wira"></div><div id="battlePet" class="hidden"></div></div><div id="enemy" class="unit"><div class="enemySpriteWrap"><img id="enemySprite" src="assets/enemies/minions/askabus.webp" alt="Musuh"></div></div></div></div><div class="controls"><button id="play" disabled>Cuba serangan</button><span id="status">Memuatkan watak…</span></div><p class="note">Balingan perisai lama ditarik kerana menggunakan base salah. Pose itu akan dibina semula daripada Wira rasmi.</p></main>
<script src="js/heroes.js?v=3.86.72"></script><script>
window.db={hero:'wira',rewards:{}};let timers=new Set(),generation=0;
window.PABattlePresentation={later(fn,delay){const gen=generation;const id=setTimeout(()=>{timers.delete(id);if(gen===generation)fn()},delay);timers.add(id);return id}};
window.playSfx=()=>{};
window.cancelPreview=()=>{generation++;timers.forEach(clearTimeout);timers.clear();window.PACombatMotion?.reset()};
window.selectPreview=async id=>{cancelPreview();db.hero=canonicalHeroId(id);const img=document.getElementById('heroIdle');img.src=HEROES[db.hero].idle;img.alt=HEROES[db.hero].name;await img.decode();window.PACombatMotion?.sync();document.querySelectorAll('#choices button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hero===db.hero)));document.getElementById('play').disabled=false;document.getElementById('status').textContent=HEROES[db.hero].name+' sedia';};
window.playPreview=()=>{const info=window.PACombatMotion?.begin('hero','enemy',false,4);if(!info)return null;document.getElementById('play').disabled=true;document.getElementById('status').textContent=HEROES[db.hero].name+' menyerang';PABattlePresentation.later(()=>{document.getElementById('play').disabled=false;document.getElementById('status').textContent='Sedia'},info.completionDelay+10);return info};
document.getElementById('choices').innerHTML=Object.entries(HEROES).map(([id,h])=>'<button data-hero="'+id+'" aria-pressed="'+(id==='wira')+'">'+h.name+'</button>').join('');document.getElementById('choices').onclick=e=>{if(e.target.dataset.hero)selectPreview(e.target.dataset.hero)};document.getElementById('play').onclick=playPreview;
window.addEventListener('load',async()=>{await Promise.all(Object.values(HEROES).map(h=>{const i=new Image();i.src=h.idle;return i.decode()}));await new Promise(r=>setTimeout(r,100));selectPreview('wira')});
</script><script src="js/combat-motion-v1.js?v=3.86.72"></script></body></html>
