<!doctype html><html lang="ms"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tren Jam Focus Bridge E2E</title>
<style>body{margin:0;background:#142638;color:#fff;font:16px system-ui}main{max-width:850px;margin:24px auto;padding:18px}button{font:inherit;font-weight:800;border:2px solid #d3aa58;border-radius:10px;padding:10px 15px;color:#19334d;background:#fff4d6;cursor:pointer}#out{margin-top:16px;padding:14px;background:#fffae8;color:#19334d;border-radius:10px;white-space:pre-wrap}</style></head>
<body><main><h1>Tren Jam · ujian bridge tempatan</h1><p>Profil palsu sementara untuk menguji overlay, mesej diagnosis, simpanan laporan dan kad fokus.</p><button id="launch">Mulakan Kemahiran Fokus Masa</button><div id="coreTab"></div><pre id="out">Belum mula</pre></main>
<script>
var db=window.db={schoolGrade:2,skills:{'D2.5.1':{mastery:40,evidence:2},'D2.5.2':{mastery:60,evidence:4},'D2.5.3':{mastery:30,evidence:5}},xp:25,coins:14,focusDiagnosticsV1:{version:1,reports:[]}};
window.__before=JSON.stringify({skills:db.skills,xp:db.xp,coins:db.coins});window.__saveCalls=0;window.__cloudCalls=0;window.PACommercial={requireFeature:()=>true};window.enforceRestuLock=()=>false;var GRAPH={skills:[{id:'D1.TIME',grade:1,chapter:'5',title:'Masa asas'},{id:'D2.5.1',grade:2,chapter:'5',title:'Jam & minit'},{id:'D2.5.2',grade:2,chapter:'5',title:'Perkaitan masa'},{id:'D2.5.3',grade:2,chapter:'5',title:'Masalah masa'}]};function questionBankFor(){return ()=>({})}window.PALearnerReview={beginQuestion(q,ctx){this.q=q;this.ctx=ctx},firstWrong(){},hintUsed(){},resolve(q,result,profile){profile.learnerReviewV1??={schema:1,encounters:[]};profile.learnerReviewV1.encounters.push({grade:this.ctx.grade,skillId:q.skill,questionKey:q.questionId,archetypeId:q.archetypeId,outcome:result.usedHint?'assisted':'independent',mode:'practice',resolvedAt:Date.now()})}};
function save(){window.__saveCalls++}window.PACloud={scheduleSave(){window.__cloudCalls++}};window.PAFocusPractice={close(){}};
</script><script src="../js/guardian-focus.js"></script><script src="../js/engine/focus-time-diagnostic-v1.js"></script><script src="../js/menara-jam-router.js"></script><script src="../js/wirayung-live-bridge.js"></script>
<script>
document.getElementById('launch').onclick=()=>window.PAWirayungLive.tryStartFocus('D2.5.3');
window.setInterval(()=>{const r=db.focusDiagnosticsV1.reports.at(-1);if(!r)return;document.getElementById('out').textContent=JSON.stringify({savedReport:r,skillsAndRewardsUnchanged:window.__before===JSON.stringify({skills:db.skills,xp:db.xp,coins:db.coins}),saveCalls:window.__saveCalls,cloudCalls:window.__cloudCalls,parentText:document.querySelector('#paWirayungReport')?.innerText||''},null,2)},300);
</script></body></html>
