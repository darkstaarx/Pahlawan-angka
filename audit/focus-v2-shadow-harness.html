<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus v2 isolated shadow audit</title>
<style>body{font:16px system-ui;background:#142638;color:#fff;padding:24px}button{padding:12px;margin:4px}pre{white-space:pre-wrap}iframe{width:100%;height:640px;border:1px solid #aaa}.groupBoxes{display:flex;flex-wrap:wrap;gap:4px;max-width:280px;margin-top:8px}.groupBox{display:flex;flex-wrap:wrap;gap:2px;border:1px solid #456;padding:4px;max-width:65px}.object{width:6px;height:6px;border-radius:50%;background:#274}.scenario{border:1px solid #55728a;border-radius:12px;padding:16px;margin:16px 0}.recommendation{max-width:680px;background:#fff;color:#172a3d;border:2px solid #67c8a5;border-radius:14px;padding:16px;margin:12px 0}.recommendation h3{margin:0 0 8px}.recommendation p{margin:6px 0}.recommendation[data-state="needs_contrast"]{border-color:#f1bd57}.recommendation[data-state="insufficient_evidence"]{border-color:#8aa0b1}</style>
<h1>Focus v2 isolated shadow audit</h1><p>No production scoring, routing or persistence is connected to this harness.</p><button id="run" disabled>Run shadow audit</button><pre id="output">Explicit ?shadow=1 opt-in required.</pre>
<script>
(async()=>{
 if(new URLSearchParams(location.search).get('shadow')!=='1')return;
 for(const src of ['../js/engine/focus-diagnosis-v2.js?audit=add-sub-v4','../js/engine/focus-diagnosis-shadow-v1.js?audit=add-sub-v4','../js/engine/focus-probe-session-v2.js?audit=add-sub-v4'])await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.append(s)});
 // Load the exact current source generators into this isolated audit page so a
 // browser cache on the game iframe cannot hide a branch-only tag change.
 window.sess={mode:'practice',questionHistory:[]};
 for(const src of ['../questions/helpers.js?audit=add-sub-v4','../questions/d1/core.js?audit=add-sub-v4','../questions/d2/topic-2.js?audit=add-sub-v4','../questions/d3/core.js?audit=add-sub-v4','../questions/d4/core.js?audit=add-sub-v4','../questions/kssr-archetypes-v3.9.0.js?audit=add-sub-v4','../questions/kssr-content-v3.11.js?audit=add-sub-v4'])await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.append(s)});
 const frame=document.createElement('iframe');frame.title='Fresh local app runtime';frame.src='../index.html';document.body.append(frame);
 const fixtures=await (await fetch('../data/focus-v2/diagnosis-fixtures-v1.json')).json();
 // Explicit local audit UI. The production learner review writes to a disposable
 // clone only; no save/cloud/mastery/rewards functions are called.
 const panel=document.createElement('section');panel.className='scenario';panel.innerHTML='<h2>Probe → recovery → transfer (shadow)</h2><p>Soalan dan jawapan di bawah hanya mengubah profil sementara dalam memori.</p><label>School grade <select id="probeGrade"><option value="2">2 · available</option><option value="6" disabled>6 · blocked (no cross-grade probe bank)</option></select></label> <button id="probeStart">Start isolated session</button><button id="scenarioMoney">Simulate: money context issue</button><button id="scenarioDivision">Simulate: division facts issue</button><div id="probeRecommendation" class="recommendation" hidden aria-live="polite"></div><p id="probeQuestion"></p><div id="probeAnswers"></div><button id="probeHint" hidden>Hint used</button><pre id="probeReport"></pre>';document.body.insertBefore(panel,frame);
 let probeSession,probeQuestion,probeProfile,probeCollector,probeBefore;
 const labels={'div.facts':'Fakta bahagi asas','div.regroup':'Bahagi dengan regrouping','money.ringgit_sen':'Nilai Ringgit dan sen','operation.choose':'Memilih operasi','number.place_value':'Nilai tempat / nombor berbilang digit','add.facts':'Fakta tambah asas','sub.facts':'Fakta tolak asas','add.place_value':'Tambah mengikut nilai tempat','sub.place_value':'Tolak mengikut nilai tempat','add.regroup':'Tambah dengan pengumpulan semula','sub.regroup':'Tolak dengan peminjaman'};
 function renderRecommendation(report){
  const card=document.getElementById('probeRecommendation');card.hidden=false;card.dataset.state=report.state;
  const title=report.rootCause?`Calon fokus: ${labels[report.rootCause]||report.rootCause}`:report.state==='needs_contrast'?'Belum cukup bukti untuk pilih punca':'Belum cukup bukti untuk cadangan';
  const next=labels[report.nextProbe]||report.nextProbe||'kumpul soalan berbeza';
  const detail=report.state==='candidate'?'Dapatan ini sementara; semak melalui latihan asas dan soalan pindahan.':report.state==='needs_contrast'?`Langkah seterusnya: uji ${next}. Sistem tidak melabel kelemahan daripada soalan wang sahaja.`:'Kumpul jawapan pada lebih daripada satu bentuk soalan.';
  card.replaceChildren();const h=document.createElement('h3');h.textContent='Cadangan Focus (shadow)';const strong=document.createElement('p');strong.textContent=title;const body=document.createElement('p');body.textContent=detail;const meta=document.createElement('small');meta.textContent=`Bukti bertag: ${report.evidence?.uniqueTaggedQuestions||0} soalan · Tiada mastery/reward diubah.`;card.append(h,strong,body,meta);
 }
 function beginShadowProfile(grade,origin){probeProfile={schoolGrade:grade,skills:{'D2.2.4':{mastery:61},'D2.4.5':{mastery:43}},xp:100,coins:55};probeBefore=JSON.stringify(probeProfile);probeSession=PAFocusProbeSessionV2.createSession({originSkillId:origin,schoolGrade:grade},PAFocusDiagnosisV2);probeCollector=PAFocusShadowCollectorV1.createSession({originSkillId:origin},PAFocusDiagnosisV2);document.getElementById('probeRecommendation').hidden=true}
 window.startProbeAudit=grade=>{if(grade!==2){const report={state:'blocked',rootCause:null,nextProbe:null,reason:'No authored cross-grade probe bank; D2 questions must not be presented as D6 remediation.',writes:0};const card=document.getElementById('probeRecommendation');card.hidden=false;card.dataset.state='insufficient_evidence';card.textContent='Cross-grade diagnosis is blocked: no valid D6-to-foundation probe bank is available.';document.getElementById('probeReport').textContent=JSON.stringify(report,null,2);return null}beginShadowProfile(grade,'D2.4.5');return showProbe()};
 function showProbe(){
  const w=frame.contentWindow;if(!w.PALearnerReview)throw Error('App learner review not ready');
  probeQuestion=probeSession.next();let report=probeSession.evaluate();
  if(probeQuestion){const begin=w.PALearnerReview.beginQuestion(probeQuestion,{grade:probeSession.schoolGrade,mode:'practice'});probeCollector.capture(begin,probeQuestion)}
  else if(probeCollector){report=probeCollector.evaluate(probeProfile);probeCollector.close();report.integrity=probeBefore===JSON.stringify(Object.fromEntries(Object.entries(probeProfile).filter(([k])=>k!=='learnerReviewV1')));renderRecommendation(report)}
  document.getElementById('probeReport').textContent=JSON.stringify(report,null,2);
  const answers=document.getElementById('probeAnswers');answers.replaceChildren();document.getElementById('probeHint').hidden=!probeQuestion;
  document.getElementById('probeQuestion').textContent=probeQuestion?probeQuestion.prompt:'Session complete: '+report.verification;
  if(probeQuestion){for(const v of [probeQuestion.answer,...probeQuestion.wrong.map(x=>x.v)]){const b=document.createElement('button');b.textContent=v;if(probeQuestion.groupModel){const boxes=document.createElement('span');boxes.className='groupBoxes';boxes.setAttribute('aria-hidden','true');for(let i=0;i<probeQuestion.groupModel.groups;i++){const box=document.createElement('span');box.className='groupBox';for(let j=0;j<parseInt(v,10);j++){const dot=document.createElement('span');dot.className='object';box.append(dot)}boxes.append(box)}b.append(boxes)}b.onclick=()=>{if(v!==probeQuestion.answer){w.PALearnerReview.firstWrong(probeQuestion,{value:v});b.disabled=true;return}finishProbe(true)};answers.append(b)}}return probeQuestion;
 }
 function finishProbe(correct){const record=frame.contentWindow.PALearnerReview.resolve(probeQuestion,{correct,seconds:5},probeProfile);const result=probeSession.record(probeQuestion,{outcome:record.outcome});showProbe();return result}
 window.probeAuditState=()=>({question:probeQuestion,report:probeSession.evaluate(),profile:probeProfile});
 window.resolveProbeAudit=outcome=>{const review=frame.contentWindow.PALearnerReview;if(outcome==='corrected'||outcome==='unresolved')review.firstWrong(probeQuestion,{value:'audit wrong'});if(outcome==='assisted')review.hintUsed(probeQuestion,1);return finishProbe(outcome!=='unresolved')};
 function runScenario(outcomeFor){const grade=2;beginShadowProfile(grade,'D2.4.5');const w=frame.contentWindow,trace=[];let q;
  while((q=probeSession.next())){const family=q.focusDiagnosticV1.diagnosticFamily,outcome=outcomeFor(family),begin=w.PALearnerReview.beginQuestion(q,{grade,mode:'practice'});probeCollector.capture(begin,q);if(outcome==='corrected'||outcome==='unresolved')w.PALearnerReview.firstWrong(q,{value:'scenario wrong'});if(outcome==='assisted')w.PALearnerReview.hintUsed(q,1);const record=w.PALearnerReview.resolve(q,{correct:outcome!=='unresolved',seconds:5},probeProfile);probeSession.record(q,{outcome:record.outcome});trace.push({family,outcome:record.outcome,questionKey:record.questionKey})}
  const report=probeCollector.evaluate(probeProfile);probeCollector.close();report.integrity=probeBefore===JSON.stringify(Object.fromEntries(Object.entries(probeProfile).filter(([k])=>k!=='learnerReviewV1')));renderRecommendation(report);document.getElementById('probeQuestion').textContent='Scenario selesai · '+trace.length+' soalan pembanding';document.getElementById('probeAnswers').replaceChildren();document.getElementById('probeReport').textContent=JSON.stringify({report,trace,masteryBefore:{'D2.2.4':61,'D2.4.5':43},masteryAfter:probeProfile.skills},null,2);return report;
 }
 window.runMoneyContextScenario=()=>runScenario(f=>f==='money'?'unresolved':'independent');
 window.runDivisionFactsScenario=()=>runScenario(f=>f==='money'||f==='division_fact'?'unresolved':'independent');
 document.getElementById('probeStart').onclick=()=>startProbeAudit(Number(document.getElementById('probeGrade').value));document.getElementById('probeHint').onclick=()=>frame.contentWindow.PALearnerReview.hintUsed(probeQuestion,1);document.getElementById('scenarioMoney').onclick=()=>runMoneyContextScenario();document.getElementById('scenarioDivision').onclick=()=>runDivisionFactsScenario();
 const addSubPanel=document.createElement('section');addSubPanel.className='scenario';addSubPanel.innerHTML='<h2>Tambah &amp; tolak: diagnosis ciri nombor (shadow)</h2><p>Ujian ini bandingkan soalan sebenar Darjah 1–2: fakta asas, bilangan digit, carry dan pinjam. Semua hasil hanya dalam memori.</p><button id="simulateDigits">Simulate: digit besar mengelirukan</button><button id="simulateAddCarry">Simulate: tambah carry</button><button id="simulateSubBorrow">Simulate: tolak pinjam</button><button id="simulateAddFacts">Simulate: fakta tambah</button><button id="simulateSubFacts">Simulate: fakta tolak</button><div id="addSubRecommendation" class="recommendation" hidden aria-live="polite"></div><h3 id="addSubPracticeTitle" hidden>Set latihan sasaran (shadow preview)</h3><ol id="addSubPractice" hidden></ol><pre id="addSubReport"></pre>';document.body.insertBefore(addSubPanel,frame);
 function sampleArithmetic(skill,grade,id,predicate,exclude=[]){const bank=window.PAQuestionBanks[grade];if(typeof bank!=='function')throw Error('Question bank unavailable: '+grade);for(let i=0;i<3000;i++){const q=bank(id,{mastery:20,evidence:0},false),tag=q?.focusDiagnosticV1,fp=tag?.evidence?.variantFingerprint;if(tag?.tagOrigin==='authored'&&tag.originSkillId===skill&&tag.contextDomain==='number'&&tag.probes.diagnosticPurpose==='normal'&&predicate(tag.arithmeticProfile.operandDimensions)&&!exclude.includes(fp)){q.skill=skill;q.token='add-sub-'+Math.random();return q}}throw Error('No authored question matched requested number feature: '+skill+' / '+id)}
 function buildPracticePreview(plan){const usedBySkill=new Map();return plan.items.map(spec=>{const grade=spec.skillId.startsWith('D1.')?'d1':'d2t2',filter=spec.filter||{},id=spec.skillId,predicate=f=>{if(filter.maxOperandDigitsAtLeast&&f.maxOperandDigits<filter.maxOperandDigitsAtLeast)return false;if(typeof filter.usesRegrouping==='boolean'&&f.usesRegrouping!==filter.usesRegrouping)return false;if(typeof filter.regroupingColumnCount==='number'&&f.regroupingColumns.length!==filter.regroupingColumnCount)return false;if(typeof filter.regroupingColumnCountAtLeast==='number'&&f.regroupingColumns.length<filter.regroupingColumnCountAtLeast)return false;if(typeof filter.zeroCrossingBorrow==='boolean'&&f.zeroCrossingBorrow!==filter.zeroCrossingBorrow)return false;if(filter.exactFact&&!f.factDependencies.includes(filter.exactFact))return false;return true},used=usedBySkill.get(spec.skillId)||[],q=sampleArithmetic(spec.skillId,grade,id,predicate,used);used.push(q.focusDiagnosticV1.evidence.variantFingerprint);usedBySkill.set(spec.skillId,used);return{spec,q}})}
 function runAddSubScenario(kind){const w=frame.contentWindow,items=[];const add=(skill,grade,id,pred,outcome,n=2)=>{const selected=[];while(selected.length<n){const q=sampleArithmetic(skill,grade,id,pred,selected.map(x=>x.focusDiagnosticV1.evidence.variantFingerprint));selected.push(q);items.push({q,outcome})}};
  if(kind==='digits'){add('D1.ADD100','d1','D1.ADD100',f=>f.maxOperandDigits===2&&!f.usesRegrouping,'independent');add('D1.SUB100','d1','D1.SUB100',f=>f.maxOperandDigits===2&&!f.usesRegrouping,'independent');add('D2.2.1','d2t2','D2.2.1',f=>f.maxOperandDigits>=3&&!f.usesRegrouping,'unresolved');add('D2.2.2','d2t2','D2.2.2',f=>f.maxOperandDigits>=3&&!f.usesRegrouping,'unresolved')}
  else if(kind==='addCarry'){add('D2.2.1','d2t2','D2.2.1',f=>f.maxOperandDigits>=2&&!f.usesRegrouping,'independent');add('D2.2.1','d2t2','D2.2.1',f=>f.maxOperandDigits>=2&&f.usesRegrouping,'unresolved')}
  else if(kind==='subBorrow'){add('D2.2.2','d2t2','D2.2.2',f=>f.maxOperandDigits>=2&&!f.usesRegrouping,'independent');add('D2.2.2','d2t2','D2.2.2',f=>f.maxOperandDigits>=2&&f.usesRegrouping,'unresolved')}
  else if(kind==='addFacts'){add('D1.ADD20','d1','D1.ADD20',f=>f.maxOperandDigits===1&&!f.usesRegrouping,'unresolved')}
  else{add('D1.SUB20','d1','D1.SUB20',f=>f.maxOperandDigits===1&&!f.usesRegrouping,'unresolved')}
  const profile={schoolGrade:2,skills:{'D1.ADD20':{mastery:44},'D1.SUB20':{mastery:42},'D2.2.1':{mastery:62},'D2.2.2':{mastery:47}},xp:100,coins:55};const protectedBefore=JSON.stringify({skills:profile.skills,xp:profile.xp,coins:profile.coins}),collector=PAFocusShadowCollectorV1.createSession({originSkillId:'D2.2.1'},PAFocusDiagnosisV2),trace=[];
  for(const [i,item] of items.entries()){const q=item.q,begin=w.PALearnerReview.beginQuestion(q,{grade:2,mode:'practice',now:Date.now()+i*1000});if(!collector.capture(begin,q))throw Error('Shadow collector rejected authored arithmetic tag');if(item.outcome==='unresolved')w.PALearnerReview.firstWrong(q,{value:'scenario wrong'});const saved=w.PALearnerReview.resolve(q,{correct:item.outcome==='independent',seconds:5},profile);trace.push({skillId:q.skill,outcome:saved.outcome,diagnosticFamily:q.focusDiagnosticV1.diagnosticFamily,dimensions:q.focusDiagnosticV1.arithmeticProfile.operandDimensions,variantFingerprint:q.focusDiagnosticV1.evidence.variantFingerprint})}
  const report=collector.evaluate(profile);collector.close();report.integrity=protectedBefore===JSON.stringify({skills:profile.skills,xp:profile.xp,coins:profile.coins});let preview=[];try{preview=buildPracticePreview(report.practicePlan)}catch(error){report.practicePlanPreviewError=String(error.message||error)}const card=document.getElementById('addSubRecommendation');card.hidden=false;card.dataset.state=report.state;card.replaceChildren();const h=document.createElement('h3');h.textContent='Cadangan tambah-tolak (shadow)';const title=document.createElement('p');title.textContent=report.rootCause?'Calon fokus: '+(labels[report.rootCause]||report.rootCause):'Belum cukup bukti untuk pilih punca';const detail=document.createElement('p');detail.textContent=report.rootCause?'Calon sementara berdasarkan soalan berbeza; perlu disahkan dengan latihan bebas dan soalan pindahan.':'Perlu banding lagi beberapa soalan yang berbeza sebelum buat cadangan.';card.append(h,title,detail);if(report.factCandidates?.length){const facts=document.createElement('p');facts.textContent='Fakta untuk uji semula: '+report.factCandidates.map(x=>`${x.fact} (calon, perlu diuji semula)`).join(', ');card.append(facts)}const meta=document.createElement('small');meta.textContent=`${report.evidence.uniqueTaggedQuestions} soalan bertag · profil dan ganjaran tidak berubah.`;card.append(meta);const practice=document.getElementById('addSubPractice'),practiceTitle=document.getElementById('addSubPracticeTitle');practice.replaceChildren();practice.hidden=preview.length===0;practiceTitle.hidden=preview.length===0;for(const entry of preview){const li=document.createElement('li');li.textContent=`${entry.spec.skillId} · ${entry.q.prompt.replace(/<[^>]*>/g,'')}`;practice.append(li)}document.getElementById('addSubReport').textContent=JSON.stringify({report,trace,practicePreview:preview.map(x=>({skillId:x.spec.skillId,prompt:x.q.prompt,dimensions:x.q.focusDiagnosticV1.arithmeticProfile.operandDimensions}))},null,2);return report;
 }
 window.runAddSubShadowScenario=runAddSubScenario;document.getElementById('simulateDigits').onclick=()=>runAddSubScenario('digits');document.getElementById('simulateAddCarry').onclick=()=>runAddSubScenario('addCarry');document.getElementById('simulateSubBorrow').onclick=()=>runAddSubScenario('subBorrow');document.getElementById('simulateAddFacts').onclick=()=>runAddSubScenario('addFacts');document.getElementById('simulateSubFacts').onclick=()=>runAddSubScenario('subFacts');
 window.runShadowAudit=async()=>{
  const w=frame.contentWindow;
  const deadline=Date.now()+30000;while(w.document.readyState!=='complete'||typeof w.generate!=='function'||!w.PALearnerReview||!w.__PA_LIVE_ASSET_REFRESHED){if(Date.now()>deadline)throw Error('App runtime unavailable');await new Promise(r=>setTimeout(r,100))}
  await new Promise(r=>setTimeout(r,1000));
  const rows=fixtures.cases.map(f=>{const before=JSON.stringify(f),actual=PAFocusDiagnosisV2.evaluate(f);return{id:f.id,expected:f.expected,actual,pass:actual.state===f.expected.state&&actual.rootCause===f.expected.rootCause&&actual.nextProbe===f.expected.nextProbe&&JSON.stringify(f)===before&&actual.writes===0}});
  const metadata=[],skills=w.eval('GRAPH.skills');
  for(const skill of skills)for(const band of [15,35,80]){
   w.eval('db={schoolGrade:'+skill.grade+'};sess={mode:"practice",questionFingerprints:[],questionHistory:[]}');
   const samples=[],unique=new Set();let valid=0,tagged=0;
   for(let i=0;i<20;i++){
    const q=w.generate(skill.id,{mastery:band,evidence:5,confidence:band,correct:2,wrong:3},{strictSkill:true,battleTier:'gembok'});
    if(!q)continue;if(q.prompt&&q.answer!==undefined&&q.title!=='Fallback')valid++;
    unique.add(w.questionFingerprint(q));if(q.focusDiagnosticV1)tagged++;
    if(i<2)samples.push({skill:q.skill,prompt:q.prompt,answer:q.answer,archetypeId:q.archetypeId,focusDiagnosticV1:q.focusDiagnosticV1||null});
   }
   metadata.push({id:skill.id,grade:skill.grade,band,valid,unique:unique.size,tagged,samples});
  }
  // Real final runtime -> production review -> collector, on an ephemeral clone only.
  const profile={schoolGrade:2,skills:{'D2.2.4':{mastery:61},'D2.4.5':{mastery:43}},xp:100,coins:55,level:3,rewards:{},completedMissions:{}};
  const protectedBefore=JSON.stringify(profile),collector=PAFocusShadowCollectorV1.createSession({originSkillId:'D2.4.5'},PAFocusDiagnosisV2);
  const captures=[];
  w.eval('db={schoolGrade:2};sess={mode:"practice",questionFingerprints:[],questionHistory:[]}');
  for(const [i,outcome] of ['independent','corrected','assisted','unresolved'].entries()){
   const id=i%2?'D2.2.4':'D2.4.5',q=w.generate(id,{mastery:15,evidence:0},{strictSkill:true,battleTier:'gembok'});q.skill=id;q.token='shadow-'+i;
   const begin=w.PALearnerReview.beginQuestion(q,{grade:2,mode:'practice',now:1000+i*1000});
   const captured=collector.capture(begin,q);
   if(outcome==='corrected'||outcome==='unresolved')w.PALearnerReview.firstWrong(q,{now:1100+i*1000,seconds:3});
   if(outcome==='assisted')w.PALearnerReview.hintUsed(q,1);
   const record=w.PALearnerReview.resolve(q,{correct:outcome!=='unresolved',seconds:5,now:1500+i*1000},profile);
   captures.push({skill:q.skill,captured,expected:outcome,actual:record.outcome,tag:q.focusDiagnosticV1||null});
  }
  const beforeEvaluation=JSON.stringify(profile),decision=collector.evaluate(profile),stats=collector.stats();collector.close();
  const protectedAfter=JSON.stringify(Object.fromEntries(Object.entries(profile).filter(([k])=>k!=='learnerReviewV1')));
  const result={rows,metadata,captures,decision,stats,integrity:protectedBefore===protectedAfter&&beforeEvaluation===JSON.stringify(profile),closed:collector.stats().closed};
  window.shadowResult=result;document.getElementById('output').textContent=JSON.stringify({fixtures:rows.filter(x=>x.pass).length,total:rows.length,validQuestions:metadata.reduce((s,x)=>s+x.valid,0),taggedQuestions:metadata.reduce((s,x)=>s+x.tagged,0),captures,decision,integrity:result.integrity},null,2);return result;
 };
 document.getElementById('run').disabled=false;document.getElementById('output').textContent='Ready. Results are in memory only.';
 document.getElementById('run').onclick=()=>runShadowAudit().catch(e=>document.getElementById('output').textContent=e.stack);
})();
</script></html>
